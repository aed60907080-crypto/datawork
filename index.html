<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00897A">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صيانة الأجهزة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>سجل صيانة الأجهزة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ===================== TOKENS ===================== */
:root{
  --paper:#E9EEEE; --surface:#FFFFFF; --surface-2:#F5F8F8; --surface-3:#ECF2F1;
  --ink:#112226; --ink-2:#4D6064; --ink-3:#7B8C8F;
  --line:#D1DBDA; --line-2:#B4C3C1;
  --accent:#00897A; --accent-deep:#065A50; --accent-soft:#DBEFEC;
  --site-a:#00897A; --site-a-soft:#DBEFEC;
  --site-b:#4257C8; --site-b-soft:#E1E6FA;
  --ok:#2E7D53; --ok-soft:#DEF0E5;
  --warn:#B9781A; --warn-soft:#FAEDD7;
  --crit:#A8322C; --crit-soft:#F8E3E1;
  --c1:#00897A; --c2:#C05A0C; --c3:#4257C8; --c4:#AF2F4E; --c5:#8B3BAE; --c6:#707B14;
  --grid:#E4EBEA;
  --shadow-1:0 1px 2px rgba(17,34,38,.05);
  --shadow-2:0 2px 4px rgba(17,34,38,.05),0 16px 32px -24px rgba(17,34,38,.35);
  --shadow-3:0 24px 60px -20px rgba(17,34,38,.35),0 2px 8px rgba(17,34,38,.12);
  --r-s:5px; --r-m:8px; --r-l:12px;
  --nav-w:250px;
  --f-display:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1112; --surface:#141C1D; --surface-2:#192325; --surface-3:#202C2E;
    --ink:#E5EDEB; --ink-2:#9AACAB; --ink-3:#738685;
    --line:#263537; --line-2:#354A4C;
    --accent:#1FA592; --accent-deep:#8FDCD0; --accent-soft:#11302D;
    --site-a:#12A38F; --site-a-soft:#10302C;
    --site-b:#6D82DE; --site-b-soft:#1B2340;
    --ok:#4FA97A; --ok-soft:#12291D;
    --warn:#D2962F; --warn-soft:#2E2312;
    --crit:#D8615A; --crit-soft:#321816;
    --c1:#12A38F; --c2:#D2761A; --c3:#6D82DE; --c4:#DB5872; --c5:#AE6ACF; --c6:#879B1F;
    --grid:#213032;
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 2px 4px rgba(0,0,0,.25),0 16px 32px -24px rgba(0,0,0,.8);
    --shadow-3:0 24px 60px -20px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0B1112; --surface:#141C1D; --surface-2:#192325; --surface-3:#202C2E;
  --ink:#E5EDEB; --ink-2:#9AACAB; --ink-3:#738685;
  --line:#263537; --line-2:#354A4C;
  --accent:#1FA592; --accent-deep:#8FDCD0; --accent-soft:#11302D;
  --site-a:#12A38F; --site-a-soft:#10302C;
  --site-b:#6D82DE; --site-b-soft:#1B2340;
  --ok:#4FA97A; --ok-soft:#12291D;
  --warn:#D2962F; --warn-soft:#2E2312;
  --crit:#D8615A; --crit-soft:#321816;
  --c1:#12A38F; --c2:#D2761A; --c3:#6D82DE; --c4:#DB5872; --c5:#AE6ACF; --c6:#879B1F;
  --grid:#213032;
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 2px 4px rgba(0,0,0,.25),0 16px 32px -24px rgba(0,0,0,.8);
  --shadow-3:0 24px 60px -20px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.5);
}

/* ===================== BASE ===================== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:14.5px; line-height:1.6;
  font-feature-settings:"ss01";
}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:700; margin:0; text-wrap:balance; line-height:1.35}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent); text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===================== SHELL ===================== */
.app{display:grid; grid-template-columns:var(--nav-w) 1fr; min-height:100vh}

.nav{
  background:var(--surface); border-inline-start:1px solid var(--line);
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
  padding:18px 14px 12px; min-width:0;
}
.brand{display:flex; gap:11px; align-items:flex-start; padding:0 6px 16px; border-bottom:1px solid var(--line)}
.seal{
  width:38px;height:38px;flex:none;border-radius:50%;
  border:1.5px solid var(--accent); display:grid;place-items:center;
  background:var(--accent-soft); color:var(--accent-deep);
  font-family:var(--f-display); font-size:15px; font-weight:700;
}
.brand-t{font-family:var(--f-display); font-size:14.5px; font-weight:700; letter-spacing:-.2px}
.brand-s{font-size:11px; color:var(--ink-3); letter-spacing:.02em; margin-top:1px}

.nav-list{display:flex; flex-direction:column; gap:1px; margin-top:14px; overflow-y:auto; flex:1; min-width:0}
.nav-b{
  display:flex; align-items:center; gap:10px; width:100%; text-align:start;
  padding:9px 11px; border:0; background:none; border-radius:var(--r-m);
  color:var(--ink-2); font-size:14px; font-weight:500; cursor:pointer;
  transition:background .12s, color .12s;
}
.nav-b:hover{background:var(--surface-3); color:var(--ink)}
.nav-b[aria-current="page"]{background:var(--accent-soft); color:var(--accent-deep); font-weight:600}
.nav-b .ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav-b .badge{margin-inline-start:auto; font-size:11px; font-weight:600; background:var(--surface-3); color:var(--ink-2); border-radius:20px; padding:1px 7px; font-variant-numeric:tabular-nums}
.nav-b[aria-current="page"] .badge{background:var(--surface); color:var(--accent-deep)}
.nav-foot{border-top:1px solid var(--line); padding-top:10px; display:flex; gap:6px; align-items:center; justify-content:space-between}
.store-dot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.store-dot i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:block}
.store-dot.live i{background:var(--ok)}

.main{min-width:0; display:flex; flex-direction:column}

/* ---- site switcher header ---- */
.top{
  position:sticky; top:0; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.top-rail{height:3px; background:var(--line-2); transition:background .2s}
.top[data-site="المبنى الرئيسي"] .top-rail{background:var(--site-a)}
.top[data-site="المركز الحكومي"] .top-rail{background:var(--site-b)}
.top-in{display:flex; align-items:center; gap:14px; padding:11px 22px; flex-wrap:wrap}
.sites{display:flex; gap:0; border:1px solid var(--line); border-radius:var(--r-m); overflow:hidden; background:var(--surface-2)}
.site-b{
  border:0; background:none; padding:7px 14px; cursor:pointer; font-size:13px; font-weight:600;
  color:var(--ink-2); border-inline-end:1px solid var(--line); display:flex; align-items:center; gap:7px;
}
.site-b:last-child{border-inline-end:0}
.site-b .sq{width:8px;height:8px;border-radius:2px;background:var(--line-2)}
.site-b[data-k="المبنى الرئيسي"] .sq{background:var(--site-a)}
.site-b[data-k="المركز الحكومي"] .sq{background:var(--site-b)}
.site-b[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:inset 0 -2px 0 var(--accent)}
.top-title{font-family:var(--f-display); font-size:15px; font-weight:700}
.top-sub{font-size:11.5px; color:var(--ink-3)}
.top-sp{margin-inline-start:auto; display:flex; gap:8px; align-items:center}

.page{padding:22px; max-width:1360px; width:100%}
.page-head{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.page-head h2{font-size:22px; letter-spacing:-.3px}
.page-head p{margin:3px 0 0; color:var(--ink-2); font-size:13px; max-width:62ch}
.page-head .sp{margin-inline-start:auto; display:flex; gap:8px; flex-wrap:wrap}

/* ===================== ATOMS ===================== */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--r-m);
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  font-size:13.5px; font-weight:600; cursor:pointer; transition:background .12s,border-color .12s;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-3)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .btn.pri, :root:not([data-theme="light"]) .btn.pri{color:#04201C}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.pri{color:#fff}}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3); color:var(--ink)}
.btn.danger{color:var(--crit); border-color:var(--line-2)}
.btn.danger:hover{background:var(--crit-soft); border-color:var(--crit)}
.btn.sm{padding:5px 10px; font-size:12.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow-1)}
.card-h{display:flex; align-items:center; gap:10px; padding:14px 16px 0}
.card-h h3{font-size:14.5px}
.card-h .sp{margin-inline-start:auto; display:flex; gap:6px; align-items:center}
.card-sub{font-size:11.5px; color:var(--ink-3); padding:2px 16px 0}
.card-b{padding:14px 16px}

.eyebrow{font-size:10.5px; font-weight:600; letter-spacing:.09em; color:var(--ink-3); text-transform:uppercase}

.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px;
  font-size:11.5px; font-weight:600; background:var(--surface-3); color:var(--ink-2);
  border:1px solid transparent; white-space:nowrap;
}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:var(--ok-soft); color:var(--ok)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}
.chip.crit{background:var(--crit-soft); color:var(--crit)}
.chip.a{background:var(--site-a-soft); color:var(--site-a)}
.chip.b{background:var(--site-b-soft); color:var(--site-b)}

/* ---- forms ---- */
.field{display:flex; flex-direction:column; gap:5px}
.field > label{font-size:12px; font-weight:600; color:var(--ink-2)}
.field .hint{font-size:11px; color:var(--ink-3)}
.inp, select.inp, textarea.inp{
  width:100%; padding:8px 11px; border-radius:var(--r-m); border:1px solid var(--line-2);
  background:var(--surface-2); color:var(--ink); font-size:14px; transition:border-color .12s, background .12s;
}
.inp:focus{background:var(--surface); border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--ink-3)}
textarea.inp{resize:vertical; min-height:74px; line-height:1.6}
select.inp{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%); background-position:left 14px top 17px, left 9px top 17px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-inline-end:11px; padding-inline-start:28px}
.grid-f{display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid-f .wide{grid-column:1/-1}
.fieldset{border:1px solid var(--line); border-radius:var(--r-m); padding:14px; margin:0}
.fieldset legend{font-size:11px; font-weight:700; letter-spacing:.07em; color:var(--ink-3); padding:0 7px; text-transform:uppercase}

/* ---- tables ---- */
.tbl-wrap{overflow-x:auto; border-radius:var(--r-m)}
table.tbl{width:100%; border-collapse:collapse; font-size:13px}
table.tbl th{
  text-align:start; font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--ink-3);
  padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--surface-2);
  position:sticky; top:0;
}
table.tbl td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr.clickable{cursor:pointer}
table.tbl .r{text-align:end}
.stripe{border-inline-start:3px solid transparent}
.stripe.a{border-inline-start-color:var(--site-a)}
.stripe.b{border-inline-start-color:var(--site-b)}
.empty{padding:40px 20px; text-align:center; color:var(--ink-3); font-size:13.5px}
.empty svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.3;opacity:.5;display:block;margin:0 auto 10px}

/* ---- stat tiles ---- */
.tiles{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); margin-bottom:16px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:13px 15px; box-shadow:var(--shadow-1); position:relative; overflow:hidden}
.tile .lab{font-size:11.5px; color:var(--ink-2); font-weight:600}
.tile .val{font-family:var(--f-display); font-size:30px; font-weight:700; line-height:1.15; margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:-.5px}
.tile .foot{font-size:11.5px; color:var(--ink-3); margin-top:3px; display:flex; align-items:center; gap:5px}
.tile .foot b{font-weight:600; font-variant-numeric:tabular-nums}
.tile.accent .val{color:var(--accent)}
.tile.warn .val{color:var(--warn)}
.tile.crit .val{color:var(--crit)}

/* ---- charts ---- */
.charts{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.chart-box{position:relative}
.chart-box svg{display:block; width:100%; height:auto; overflow:visible}
.legend{display:flex; gap:14px; flex-wrap:wrap; padding:0 16px 13px; font-size:12px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block;flex:none}
.tip{
  position:fixed; z-index:200; pointer-events:none; background:var(--surface);
  border:1px solid var(--line-2); border-radius:var(--r-m); box-shadow:var(--shadow-3);
  padding:9px 11px; font-size:12.5px; min-width:130px; opacity:0; transition:opacity .1s;
}
.tip.on{opacity:1}
.tip .t-h{font-weight:700; font-size:12.5px; margin-bottom:5px; font-family:var(--f-display)}
.tip .t-r{display:flex; align-items:center; gap:7px; justify-content:space-between}
.tip .t-r i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .t-r b{font-variant-numeric:tabular-nums; margin-inline-start:12px}
.tbl-alt{display:none; padding:0 16px 14px}
.chart-box.as-table .chart-svg{display:none}
.chart-box.as-table .tbl-alt{display:block}
.card:has(.chart-box.as-table) > .legend{display:none}

/* ---- modal / drawer ---- */
.veil{
  position:fixed; inset:0; background:rgba(9,20,22,.5); backdrop-filter:blur(2px);
  z-index:100; display:flex; align-items:center; justify-content:center; padding:18px;
}
.veil[hidden]{display:none}
.modal{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  box-shadow:var(--shadow-3); width:min(680px,100%); max-height:92vh; display:flex; flex-direction:column;
}
.modal.lg{width:min(920px,100%)}
.modal-h{display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px}
.modal-h .sp{margin-inline-start:auto}
.modal-b{padding:18px; overflow-y:auto}
.modal-f{padding:13px 18px; border-top:1px solid var(--line); display:flex; gap:9px; justify-content:flex-end; background:var(--surface-2); border-radius:0 0 var(--r-l) var(--r-l)}
.x{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:5px;border-radius:var(--r-s);line-height:0}
.x:hover{background:var(--surface-3); color:var(--ink)}
.x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

/* ---- camera ---- */
.cam-stage{position:relative; background:#05090A; border-radius:var(--r-m); overflow:hidden; aspect-ratio:4/3; display:grid; place-items:center}
.cam-stage video, .cam-stage img{width:100%; height:100%; object-fit:contain; display:block}
.cam-guide{position:absolute; inset:0; pointer-events:none; display:grid; place-items:center}
.cam-guide .win{width:76%; height:26%; border:2px solid rgba(255,255,255,.9); border-radius:6px; box-shadow:0 0 0 2000px rgba(0,0,0,.34)}
.cam-guide .cap{position:absolute; bottom:9%; color:#fff; font-size:12px; background:rgba(0,0,0,.55); padding:4px 11px; border-radius:20px}
.cam-msg{color:#C9D6D5; font-size:13px; text-align:center; padding:26px; line-height:1.7}
.cam-bar{display:flex; gap:9px; align-items:center; justify-content:center; margin-top:13px; flex-wrap:wrap}
.shutter{width:58px;height:58px;border-radius:50%;border:3px solid var(--accent);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.shutter span{width:42px;height:42px;border-radius:50%;background:var(--accent);display:block}
.shutter:hover span{filter:brightness(1.1)}
.thumb{width:100%; border-radius:var(--r-m); border:1px solid var(--line); display:block; cursor:zoom-in; background:var(--surface-2)}
.photo-slot{display:flex; gap:12px; align-items:flex-start}
.photo-slot .ph{width:132px; flex:none}
.ph-empty{width:132px;height:99px;border:1.5px dashed var(--line-2); border-radius:var(--r-m); display:grid; place-items:center; color:var(--ink-3); background:var(--surface-2)}
.ph-empty svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5}

/* ---- misc ---- */
.filters{display:flex; gap:9px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l)}
.filters .field{min-width:132px}
.filters .field.grow{flex:1; min-width:190px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:7px 16px; font-size:13.5px}
.kv dt{color:var(--ink-3); font-size:12px; font-weight:600; white-space:nowrap}
.kv dd{margin:0}
.bar-mini{height:6px; background:var(--surface-3); border-radius:20px; overflow:hidden}
.bar-mini i{display:block; height:100%; border-radius:20px; background:var(--accent)}
.toast{
  position:fixed; inset-block-end:18px; inset-inline-start:50%; transform:translateX(50%) translateY(120%);
  background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:20px; z-index:300;
  font-size:13.5px; font-weight:600; box-shadow:var(--shadow-3); opacity:0; visibility:hidden;
  transition:transform .22s cubic-bezier(.2,.9,.3,1), opacity .18s;
}
.toast.on{transform:translateX(50%) translateY(0); opacity:1; visibility:visible}
.split{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; align-items:start}
.note{font-size:12.5px; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line); border-inline-start:3px solid var(--accent); border-radius:var(--r-m); padding:10px 13px}
.list-rows{display:flex; flex-direction:column; gap:1px}
.row-b{display:flex; align-items:center; gap:11px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface); cursor:pointer; text-align:start; width:100%}
.row-b:hover{background:var(--surface-2)}

const ROLE_USER = {"المبنى الرئيسي":"main", "المركز الحكومي":"gov", "__admin":"gov-supervisor", "__chief":"chief"};
function roleEmail(scope){ return ROLE_USER[scope] ? ROLE_USER[scope]+"@"+FIREBASE_CONFIG.authDomain : ""; }
function scopeOfEmail(email){
  email=String(email||"").toLowerCase();
  return Object.keys(ROLE_USER).find(k=>roleEmail(k).toLowerCase()===email) || null;
}
function authMsg(code){
  code=String(code||"");

  if(/weak-password/.test(code)) return "كلمة السر ضعيفة — ٦ أحرف على الأقل.";
  if(/requires-recent-login/.test(code)) return "انتهت صلاحية الجلسة — اخرج وادخل من جديد ثم غيّر كلمة السر.";
  if(/user-disabled/.test(code)) return "هذا الحساب موقوف من Firebase Console.";
  if(/operation-not-allowed/.test(code)) return "الدخول بالبريد وكلمة السر غير مفعّل في Firebase ← Authentication.";
  return "تعذّر الدخول ("+code+").";
}

}

/* ============================================================
   3. طبقة التخزين — قاعدة بيانات مستقلة لكل موقع
   كل موقع له قاعدته: sites/MB/… للمبنى الرئيسي و sites/GC/… للمركز الحكومي.
   الجهة لا تفتح إلا قاعدة موقعها، ورئيس القسم وحده يفتح القاعدتين وتُجمعان عنده.
   المشترك بين الموقعين: القوائم وكلمات السر والفنيون المسجّلون «لكلا الموقعين».
   ============================================================ */
const COLS = ["records","parts","movements","technicians","reports","employees","locations"];
const SITE_BY_CODE = {MB:SITES[0], GC:SITES[1]};
function colPath(col,code){ return code ? "sites/"+code+"/"+col : col; }
/* رمز قاعدة الموقع التي يُحفظ فيها المستند — "" للفنيين المشتركين بين الموقعين */
function codeFor(col,o){
  o=o||{};
  if(SITE_CODE[o.site]) return SITE_CODE[o.site];
  if(col==="reports" && SITE_BY_CODE[o.scope]) return o.scope;
  return "";
}
const Store = {
  mode:"local", db:null, ready:false,
  open:[], sitesReady:false,
  cache:{records:[],parts:[],movements:[],technicians:[],reports:[],employees:[],locations:[]},
  _parts:{},
  _unsubs:[], _gen:0,
  config:JSON.parse(JSON.stringify(DEFAULT_CONFIG)),
  access:{},
  _subs:[],
  on(fn){ this._subs.push(fn); },
  emit(){ this._subs.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } }); },
  list(col){ return this.cache[col]||[]; },
  openNames(){ return SITES.filter(s=>this.open.indexOf(SITE_CODE[s])>=0); },

  /* دمج أجزاء المجموعة القادمة من قواعد المواقع المفتوحة */
  _rebuild(col){
    const parts=this._parts[col]||{};
    let rows=[];
    Object.keys(parts).forEach(k=>{ rows=rows.concat(parts[k]); });
    if(col==="records")   rows.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
    if(col==="movements") rows.sort((a,b)=>String(b.ts||"").localeCompare(String(a.ts||"")));
    this.cache[col]=rows;
  },
  _setPart(col,code,rows){
    this._parts[col]=this._parts[col]||{};
    this._parts[col][code]=rows;
    this._rebuild(col);
  },
  /* في أي قاعدة يوجد المستند حالياً */
  _where(col,id){
    const parts=this._parts[col]||{};
    return Object.keys(parts).find(k=>parts[k].some(x=>x.id===id));
  },
  async exists(col,id,site){
    const code=SITE_CODE[site]||"";
    if(this.remote()){
      try{ const snap=await this.db.collection(colPath(col,code)).doc(id).get(); return !!snap.exists; }
      catch(e){ return true; } /* عند الشك لا نكتب فوق مستند قائم */
    }
    return !!((this._parts[col]||{})[code]||[]).find(x=>x.id===id);
  },

  async init(){
    let db=null;
    try{ db = (window.claude && window.claude.use) ? await window.claude.use("db") : null; }catch(e){ db=null; }
    if(db){ this.db=db; this.mode="db"; await this._initDb(); }
    else if(FIREBASE_CONFIG.apiKey){
      this.mode="firebase";
      try{ await this._initFirebase(); }
      catch(e){ console.error(e); this.error="تعذّر الاتصال بـ Firebase — تحقّق من الإنترنت ثم أعد تحميل الصفحة."; }
    }
    else { this.mode="local"; this._initLocal(); }
    this.ready=true; this.emit();
    if(this.mode==="db") this._migrateDb();
  },
  remote(){ return this.mode==="db" || this.mode==="firebase"; },

  /* ---------- Firebase: الدخول بحساب لكل جهة، وقواعد الأمان على الخادم تفصل المواقع ---------- */
  async _initFirebase(){
    for(const f of ["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js"]) await loadScript(FIREBASE_SDK+f);
    firebase.initializeApp(FIREBASE_CONFIG);
    this.db=firebase.firestore();
    this.db.settings({ignoreUndefinedProperties:true});
    this.auth=firebase.auth();
    await new Promise(res=>{
      let first=true;
      this.auth.onAuthStateChanged(u=>{ this._onUser(u); if(first){ first=false; res(); } });
    });
  },
  _onUser(u){
    const scope=u ? scopeOfEmail(u.email) : null;
    if(u && !scope){
      this.auth.signOut().catch(()=>{});
      if(this.ready) toast("هذا الحساب غير مرتبط بأي جهة في النظام");
      return;
    }
    if(scope){
      if(Access.state.scope!==scope) Access.adopt(scope);
      this._sharedOn();
    }else{
      this._sharedOff();
      if(Access.state.scope){ Access.state.scope=null; this.closeSites(true); }
    }
    if(this.ready) this.emit();
  },
  /* القوائم واسم رئيس القسم: تُقرأ بعد الدخول فقط */
  _sharedOn(){
    if(this._sharedUnsubs) return;
    const cfgRef=this.db.doc("config/lists"), accRef=this.db.doc("config/access");
    let seeded=false;
    this._sharedUnsubs=[
      cfgRef.onSnapshot(s=>{
        if(s.exists) this.config=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), s.data());
        else if(!seeded && !s.metadata.fromCache){ seeded=true; cfgRef.set(this.config).catch(e=>console.warn("cfg-seed",e)); }
        this.emit();
      }, e=>console.warn("cfg-sub", e)),
      accRef.onSnapshot(s=>{ this.access=s.exists ? (s.data()||{}) : {}; this.emit(); }, e=>console.warn("acc-sub", e))
    ];
  },
  _sharedOff(){
    (this._sharedUnsubs||[]).forEach(u=>{ try{ u(); }catch(e){} });
    this._sharedUnsubs=null;
    this.config=JSON.parse(JSON.stringify(DEFAULT_CONFIG)); this.access={};
  },
  async authSignIn(scope,pass,remember){
    const email=roleEmail(scope);
    try{
      const P=firebase.auth.Auth.Persistence;
      await this.auth.setPersistence(remember ? P.LOCAL : P.SESSION);
    }catch(e){}
    /* تجربة الكلمة كما كُتبت ثم بتخطيط لوحة المفاتيح الآخر */
    const tries=[pass].concat([kbToArabic(pass), kbToLatin(pass)].filter((v,i,a)=>v && v!==pass && a.indexOf(v)===i));
    for(let i=0;i<tries.length;i++){
      try{ await this.auth.signInWithEmailAndPassword(email,tries[i]); return {ok:true, variant:i>0}; }
      catch(e){ if(!/invalid-credential|wrong-password|invalid-login/.test(String(e&&e.code))) return {ok:false, msg:authMsg(e&&e.code)}; }
    }
    return {ok:false, msg:authMsg("auth/invalid-credential")};
  },
  async authChangePassword(cur,next){
    const u=this.auth.currentUser;
    if(!u) return "انتهت الجلسة — ادخل من جديد.";
    try{ await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur)); }
    catch(e){ return /invalid-credential|wrong-password/.test(String(e&&e.code)) ? "كلمة السر الحالية غير صحيحة." : authMsg(e&&e.code); }
    try{ await u.updatePassword(next); return null; }
    catch(e){ return authMsg(e&&e.code); }
  },

  /* ---------- القوائم وكلمات السر: مشتركة ---------- */
  async _initDb(){
    const db=this.db;
    const cfgRef = db.doc("config/lists");
    try{
      const snap = await cfgRef.get();
      if(snap.exists) this.config = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), snap.data());
      else await cfgRef.set(this.config);
    }catch(e){ console.warn("config", e); }
    cfgRef.onSnapshot(s=>{
      if(s.exists){
        this.config = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), s.data());
        this.emit();
      }
    }, e=>console.warn("cfg-sub", e));

    const accRef = db.doc("config/access");
    try{ const a=await accRef.get(); if(a.exists) this.access=a.data()||{}; }
    catch(e){ console.warn("access", e); }
    accRef.onSnapshot(s=>{ if(s.exists){ this.access=s.data()||{}; this.emit(); } }, e=>console.warn("acc-sub", e));
  },

  /* ---------- فتح قواعد المواقع المسموحة للجهة فقط ---------- */
  openSites(sites){
    if(!this.ready) return;
    const codes=(sites||[]).map(s=>SITE_CODE[s]).filter(Boolean).sort();
    if(this._opened && this.open.join()===codes.join()) return;
    this.closeSites(true);
    this._opened=true; this.open=codes;
    const gen=this._gen;
    const wanted=[];
    codes.forEach(code=>COLS.forEach(col=>wanted.push([col,code])));
    wanted.push(["technicians",""]); /* الفنيون المشتركون بين الموقعين */

    if(this.remote()){
      let pending=wanted.length;
      wanted.forEach(([col,code])=>{
        let q=this.db.collection(colPath(col,code));
        if(col==="records")   q=q.orderBy("date","desc").limit(1000);
        if(col==="movements") q=q.orderBy("ts","desc").limit(600);
        let first=true;
        const un=q.onSnapshot(snap=>{
          if(gen!==this._gen) return;
          let rows=snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
          if(col==="technicians" && !code) rows=rows.filter(t=>!SITE_CODE[t.site]);
          this._setPart(col,code,rows);
          if(first){ first=false; if(--pending===0) this.sitesReady=true; }
          this.emit();
        }, e=>{ console.warn(colPath(col,code), e); if(first){ first=false; if(--pending===0) this.sitesReady=true; } });
        this._unsubs.push(un);
      });
    }else{
      wanted.forEach(([col,code])=>{
        let rows=[];
        try{ rows=JSON.parse(localStorage.getItem(this._key(col,code))||"[]"); }catch(e){}
        this._setPart(col,code,rows);
      });
      this.sitesReady=true;
      setTimeout(()=>{ if(gen===this._gen) this.emit(); },0);
    }
  },
  closeSites(quiet){
    this._unsubs.forEach(u=>{ try{ u(); }catch(e){} });
    this._unsubs=[]; this._gen++;
    this._opened=false; this.open=[]; this.sitesReady=false;
    this._parts={};
    COLS.forEach(c=>{ this.cache[c]=[]; });
    if(!quiet) this.emit();
  },

  /* ---------- تخزين محلي احتياطي: مفتاح مستقل لكل موقع ---------- */
  _key(col,code){ return "mpw."+(code?code+".":"")+col; },
  _initLocal(){
    /* نقل البيانات القديمة (مفتاح واحد للموقعين) إلى مفتاح كل موقع */
    try{
      COLS.forEach(col=>{
        const raw=localStorage.getItem("mpw."+col);
        if(!raw) return;
        const rows=JSON.parse(raw)||[], keep=[];
        const moved={};
        rows.forEach(r=>{
          const code=codeFor(col,r);
          if(code){ (moved[code]=moved[code]||[]).push(r); }
          else keep.push(r);
        });
        Object.keys(moved).forEach(code=>{
          const k=this._key(col,code);
          const cur=JSON.parse(localStorage.getItem(k)||"[]");
          const ids=new Set(cur.map(x=>x.id));
          localStorage.setItem(k, JSON.stringify(cur.concat(moved[code].filter(x=>!ids.has(x.id)))));
        });
        /* الفنيون المشتركون يبقون في مفتاحهم؛ ما لا موقع له من غيرهم يُترك كما هو */
        if(col==="technicians" || keep.length) localStorage.setItem("mpw."+col, JSON.stringify(keep));
        else localStorage.removeItem("mpw."+col);
      });
    }catch(e){ console.warn("local-migrate", e); }
    try{
      const c=localStorage.getItem("mpw.config");
      if(c) this.config=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), JSON.parse(c));
    }catch(e){}
    try{
      const a=localStorage.getItem("mpw.access");
      if(a) this.access=JSON.parse(a)||{};
    }catch(e){}
  },
  _flush(col,code){
    try{ localStorage.setItem(this._key(col,code), JSON.stringify(((this._parts[col]||{})[code])||[])); }
    catch(e){ toast("تعذّر الحفظ محلياً — المساحة ممتلئة"); }
  },

  /* ---------- نقل ما كُتب في القاعدة المشتركة القديمة إلى قاعدة موقعه (مرة واحدة) ---------- */
  async _migrateDb(){
    const db=this.db, ref=db.doc("config/migration");
    try{
      const s=await ref.get();
      if(s.exists && s.data().sitesV1) return;
      const lease=await ref.acquire({holder:uid("mig"), ttlMs:120000});
      if(!lease || !lease.acquired) return;
      const photoSite={};
      let moved=0;
      for(const col of COLS){
        const snap=await db.collection(col).get();
        for(const d of snap.docs){
          const body=d.data(), code=codeFor(col,body);
          if(col==="records" && body.photoId && code) photoSite[body.photoId]=code;
          if(!code) continue;
          await db.collection(colPath(col,code)).doc(d.id).set(body);
          await db.collection(col).doc(d.id).delete();
          moved++;
        }
      }
      const ph=await db.collection("photos").get();
      for(const d of ph.docs){
        const code=photoSite[d.id]; if(!code) continue;
        await db.collection(colPath("photos",code)).doc(d.id).set(d.data());
        await db.collection("photos").doc(d.id).delete();
        moved++;
      }
      const cnt=await db.doc("config/counters").get();
      if(cnt.exists){
        const data=cnt.data()||{};
        for(const code of Object.keys(SITE_BY_CODE)){
          const mine={};
          Object.keys(data).forEach(k=>{ if(k.indexOf(code+"-")===0) mine[k]=data[k]; });
          if(Object.keys(mine).length){
            const cref=db.doc("sites/"+code+"/meta/counters"), cur=await cref.get();
            await cref.set(Object.assign({}, mine, cur.exists?cur.data():{}));
          }
        }
      }
      await ref.set({sitesV1:true, at:new Date().toISOString(), moved:moved});
    }catch(e){ console.warn("migrate", e); }
  },

  /* ---------- كتابة: كل مستند إلى قاعدة موقعه ---------- */
  async save(col,obj){
    const o=Object.assign({},obj);
    if(!o.id) o.id=uid(col.slice(0,3));
    o.updatedAt=new Date().toISOString();
    const code=codeFor(col,o);
    if(!code && col!=="technicians"){
      toast("تعذّر تحديد موقع السجل — لم يُحفظ");
      throw new Error("save without site: "+col);
    }
    const prev=this._where(col,o.id);
    if(this.remote()){
      const body=Object.assign({},o); delete body.id;
      await this.db.collection(colPath(col,code)).doc(o.id).set(body);
      /* نُقل إلى موقع آخر: يُحذف من قاعدة الموقع السابق */
      if(prev!==undefined && prev!==code) await this.db.collection(colPath(col,prev)).doc(o.id).delete();
    }else{
      this._parts[col]=this._parts[col]||{};
      if(prev!==undefined && prev!==code){
        this._parts[col][prev]=this._parts[col][prev].filter(x=>x.id!==o.id);
        this._flush(col,prev);
      }
      const arr=this._parts[col][code]=this._parts[col][code]||[];
      const i=arr.findIndex(x=>x.id===o.id);
      if(i>=0) arr[i]=o; else arr.unshift(o);
      this._flush(col,code); this._rebuild(col); this.emit();
    }
    return o.id;
  },
  async remove(col,id){
    const code=this._where(col,id);
    if(code===undefined) return;
    if(this.remote()){ await this.db.collection(colPath(col,code)).doc(id).delete(); }
    else{
      this._parts[col][code]=this._parts[col][code].filter(x=>x.id!==id);
      this._flush(col,code); this._rebuild(col); this.emit();
    }
  },
  async saveConfig(cfg){
    this.config=cfg;
    if(this.remote()){ await this.db.doc("config/lists").set(cfg); }
    else{ try{ localStorage.setItem("mpw.config",JSON.stringify(cfg)); }catch(e){} }
    this.emit();
  },
  async saveAccess(acc){
    this.access=acc;
    if(this.remote()){ await this.db.doc("config/access").set(acc); }
    else{ try{ localStorage.setItem("mpw.access",JSON.stringify(acc)); }
          catch(e){ toast("تعذّر حفظ كلمات السر على هذا المتصفح"); } }
    this.emit();
  },

  /* ---------- الصور: مستند منفصل لكل صورة داخل قاعدة موقع السجل ---------- */
  async savePhoto(site,id,dataUrl){
    const code=SITE_CODE[site]||"";
    if(this.remote()){ await this.db.collection(colPath("photos",code)).doc(id).set({dataUrl:dataUrl, at:new Date().toISOString()}); }
    else{
      try{ localStorage.setItem(this._key("photo."+id,code),dataUrl); }
      catch(e){ toast("تعذّر حفظ الصورة محلياً — حُفظ السجل بدونها"); return false; }
    }
  },
  async getPhoto(site,id){
    if(!id) return null;
    const code=SITE_CODE[site]||"";
    if(this.remote()){
      try{ const s=await this.db.collection(colPath("photos",code)).doc(id).get(); return s.exists ? s.data().dataUrl : null; }
      catch(e){ return null; }
    }
    return localStorage.getItem(this._key("photo."+id,code)) || localStorage.getItem("mpw.photo."+id);
  },
  async delPhoto(site,id){
    if(!id) return;
    const code=SITE_CODE[site]||"";
    if(this.remote()){ try{ await this.db.collection(colPath("photos",code)).doc(id).delete(); }catch(e){} }
    else{ localStorage.removeItem(this._key("photo."+id,code)); localStorage.removeItem("mpw.photo."+id); }
  },

  /* ---------- رقم السجل: رمز الموقع + السنة/الشهر + تسلسل، والعدّاد داخل قاعدة الموقع ---------- */
  async nextNo(site,date){
    const pre = SITE_CODE[site]+"-"+String(date).slice(2,4)+String(date).slice(5,7)+"-";
    const localMax = ()=> this.list("records")
      .filter(r=>String(r.no||"").indexOf(pre)===0)
      .reduce((m,r)=>Math.max(m, n(String(r.no).split("-")[2])),0);
    if(this.mode==="firebase"){
      const ref=this.db.doc("sites/"+SITE_CODE[site]+"/meta/counters");
      try{
        const next=await this.db.runTransaction(async tx=>{
          const s=await tx.get(ref);
          const data=(s.exists ? s.data() : {}) || {};
          const nx=Math.max(n(data[pre]), localMax())+1;
          const upd={}; upd[pre]=nx;
          tx.set(ref, upd, {merge:true});
          return nx;
        });
        return pre+String(next).padStart(4,"0");
      }catch(e){ console.warn("counter", e); }
    }
    if(this.mode==="db"){
      const ref=this.db.doc("sites/"+SITE_CODE[site]+"/meta/counters"), holder=uid("h");
      for(let i=0;i<4;i++){
        try{
          const res=await ref.acquire({holder:holder, ttlMs:4000});
          if(res && res.acquired){
            const s=await ref.get();
            const data=(s.exists ? s.data() : {}) || {};
            const next=Math.max(n(data[pre]), localMax())+1;
            const body=Object.assign({},data); body[pre]=next;
            await ref.set(body);
            return pre+String(next).padStart(4,"0");
          }
        }catch(e){ break; }
        await new Promise(r=>setTimeout(r,260));
      }
    }
    return pre+String(localMax()+1).padStart(4,"0");
  }
};

/* تحويل ما كُتب بتخطيط لوحة المفاتيح الخطأ: الإنجليزي بدل العربي والعكس */
const KB_EN="qwertyuiop[]asdfghjkl;'zxcvnm,./`";
const KB_AR="ضصثقفغعهخحجدشسيبلاتنمكطئءؤرىةوزظذ";
function kbToArabic(str){
  let o="";
  for(const ch of String(str)){
    const lc=ch.toLowerCase();
    if(lc==="b"){ o+="لا"; continue; }
    const i=KB_EN.indexOf(lc);
    o += i>=0 ? KB_AR[i] : ch;
  }
  return o;
}
function kbToLatin(str){
  let o="";
  for(const ch of String(str).split("لا").join("")){
    if(ch===""){ o+="b"; continue; }
    const i=KB_AR.indexOf(ch);
    o += i>=0 ? KB_EN[i] : ch;
  }
  return o;
}

const Access={
  state:{scope:null},
  async hash(pass,salt){
    const txt=String(salt)+"::"+String(pass);
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      try{
        const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
        return "s1:"+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
      }catch(e){}
    }
    let h=5381,h2=52711;
    for(let i=0;i<txt.length;i++) h=((h*33)^txt.charCodeAt(i))>>>0;
    for(let i=txt.length-1;i>=0;i--) h2=((h2*29)^txt.charCodeAt(i))>>>0;
    return "f1:"+h.toString(16)+h2.toString(16);
  },
  entries(){ return (Store.access&&Store.access.entries)||{}; },
  /* في وضع Firebase: الحسابات تُنشأ من Firebase Console، فكل الجهات مضبوطة */
  auth(){ return Store.mode==="firebase"; },
  pwMin(){ return this.auth() ? 6 : 4; },
  configured(){ if(this.auth()) return true; const e=this.entries(); return !!(e[SITES[0]]&&e[SITES[1]]); },
  hasAdmin(){ return this.auth() || !!this.entries()[ADMIN_KEY]; },
  hasChief(){ return this.auth() || !!this.entries()[CHIEF_KEY]; },
  adopt(scope){
    this.state.scope=scope;
    App.site = scope===CHIEF_KEY ? "الكل" : (scope===ADMIN_KEY ? SITES[1] : scope);
    if(scope===CHIEF_KEY && App.view==="dashboard") App.view="chief";
  },
  chiefName(){ return ((Store.access||{}).chiefName||"").trim() || "رئيس قسم الصيانة"; },
  async setMany(pairs){
    const a=Store.access||{};
    const acc={salt:a.salt||uid("slt"), entries:Object.assign({},a.entries||{})};
    for(const pr of pairs){ if(pr[1]) acc.entries[pr[0]]=await this.hash(pr[1],acc.salt); }
    acc.updatedAt=new Date().toISOString();
    await Store.saveAccess(acc);
  },
  async check(scopeKey,pass){
    const e=this.entries();
    if(!e[scopeKey]) return false;
    return (await this.hash(pass,(Store.access||{}).salt||""))===e[scopeKey];
  },
  async checkAny(scopeKey,pass){
    if(await this.check(scopeKey,pass)) return {ok:true, variant:false};
    const alts=[kbToArabic(pass), kbToLatin(pass)].filter((v,i,a)=>v && v!==pass && a.indexOf(v)===i);
    for(const v of alts){ if(await this.check(scopeKey,v)) return {ok:true, variant:true}; }
    return {ok:false, variant:false};
  },
  signIn(scopeKey,remember){
    this.state.scope=scopeKey;
    App.site = scopeKey===CHIEF_KEY ? "الكل" : (scopeKey===ADMIN_KEY ? SITES[1] : scopeKey);
    if(scopeKey===CHIEF_KEY) App.view="chief";
    if(this.auth()) return; /* جلسة Firebase تحفظ الدخول بنفسها */
    const payload=JSON.stringify({scope:scopeKey, at:Date.now()});
    try{ sessionStorage.setItem("mpw.session",payload); }catch(e){}
    try{ if(remember) localStorage.setItem("mpw.session",payload); else localStorage.removeItem("mpw.session"); }catch(e){}
  },
  signOut(){
    this.state.scope=null; App.view="dashboard"; App.params={}; gatePick=null;
    Object.assign(Sup,{tab:"passwords", q:"", site:"", dept:"", pq:"", psite:""});
    try{ sessionStorage.removeItem("mpw.session"); }catch(e){}
    try{ localStorage.removeItem("mpw.session"); }catch(e){}
    Store.closeSites(true);
    if(this.auth() && Store.auth) Store.auth.signOut().catch(()=>{});
    render();
  },
  restore(){
    if(this.auth()) return; /* يستعيدها مستمع Firebase */
    let raw=null;
    try{ raw=sessionStorage.getItem("mpw.session"); }catch(e){}
    if(!raw){ try{ raw=localStorage.getItem("mpw.session"); }catch(e){} }
    if(!raw) return;
    try{
      const s=JSON.parse(raw), e=this.entries();
      if(s && s.scope && e[s.scope]){
        this.state.scope=s.scope;
        App.site = s.scope===CHIEF_KEY ? "الكل" : (s.scope===ADMIN_KEY ? SITES[1] : s.scope);
        if(s.scope===CHIEF_KEY && App.view==="dashboard") App.view="chief";
      }
    }catch(e){}
  },
  in(){ return !!this.state.scope; },
  isAdmin(){ return this.state.scope===ADMIN_KEY; },
  isChief(){ return this.state.scope===CHIEF_KEY; },
  bothSites(){ return this.isChief(); },
  label(){
    if(this.isAdmin()) return "مشرف الفريق";
    if(this.isChief()) return "رئيس القسم";
    return this.state.scope||"";
  }
};

async function download(filename, text, mime){
  let dl=null;
  try{ dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }catch(e){}
  if(dl && dl.save){
    try{ await dl.save({filename:filename, data:text}); toast("تم حفظ الملف: "+filename); return; }catch(e){}
  }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:(mime||"text/plain")+";charset=utf-8"}));
    const a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("تم التنزيل: "+filename);
  }catch(e){
    openModal({title:"نسخ المحتوى يدوياً", size:"lg",
      body:'<p class="note">تعذّر التنزيل المباشر داخل هذه النافذة. انسخ المحتوى التالي واحفظه في ملف باسم '+esc(filename)+'</p>'+
           '<textarea class="inp mono" rows="14" style="margin-top:12px" readonly>'+esc(text)+'</textarea>',
      actions:[{label:"إغلاق", cls:"btn", act:closeModal}]});
  }
}

async function compressImage(src, maxW, maxBytes){
  maxW=maxW||1440; maxBytes=maxBytes||150*1024;
  const img=await new Promise((res,rej)=>{
    const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src;
  });
  const scale=Math.min(1, maxW/(img.naturalWidth||img.width||maxW));
  const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
  const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  cv.getContext("2d").drawImage(img,0,0,w,h);
  let q=0.72, out=cv.toDataURL("image/jpeg",q);
  while(out.length>maxBytes*1.37 && q>0.32){ q-=0.1; out=cv.toDataURL("image/jpeg",q); }
  return out;
}

        shot=await compressImage(raw);

        shootB.hidden=true; retakeB.hidden=false; torchB.hidden=true;
      };
      retakeB.onclick=()=>{
        shot=null; imgEl.hidden=true; video.hidden=false; guide.hidden=false;
        shootB.hidden=false; retakeB.hidden=true; if(track && track.getCapabilities && track.getCapabilities().torch) torchB.hidden=false;
      };
      shootB.onclick=async ()=>{
        if(!video.videoWidth){ toast("الكاميرا غير جاهزة"); return; }
        const cv=document.createElement("canvas");
        cv.width=video.videoWidth; cv.height=video.videoHeight;
        cv.getContext("2d").drawImage(video,0,0);
        shot=await compressImage(cv.toDataURL("image/jpeg",0.92));
        imgEl.src=shot; imgEl.hidden=false; video.hidden=true; guide.hidden=true;
        shootB.hidden=true; retakeB.hidden=false; torchB.hidden=true;
      };
      torchB.onclick=async ()=>{
        if(!track) return;
        torchOn=!torchOn;
        try{ await track.applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){ toast("الإضاءة غير مدعومة"); }
      };

      try{
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1440}}});
        video.srcObject=stream;
        track=stream.getVideoTracks()[0];
        if(track && track.getCapabilities && track.getCapabilities().torch) torchB.hidden=false;
      }catch(e){
        video.hidden=true; guide.hidden=true; shootB.hidden=true;
        $("#camStage",root).insertAdjacentHTML("beforeend",
          '<div class="cam-msg">تعذّر تشغيل الكاميرا في هذه النافذة.<br>استخدم زر <b>«من الملفات»</b> — سيفتح كاميرا الجهاز مباشرة على الهاتف.</div>');
      }
    }
  });
}

/* ============================================================
   8. الرسوم البيانية
   ============================================================ */
function niceMax(v){
  if(v<=4) return 4;
  const mag=Math.pow(10,Math.floor(Math.log10(v)));
  const s=[1,2,2.5,5,10];
  for(let i=0;i<s.length;i++){ if(v<=s[i]*mag) return s[i]*mag; }
  return 10*mag;
}
function roundedTop(x,y,w,h,r){
  r=Math.min(r,w/2,h);
  return "M"+x+" "+(y+h)+"V"+(y+r)+"a"+r+" "+r+" 0 0 1 "+r+" "+(-r)+"h"+(w-2*r)+"a"+r+" "+r+" 0 0 1 "+r+" "+r+"V"+(y+h)+"Z";
}
function tipAttr(html){ return ' data-tip="'+esc(html)+'"'; }

/* --- أعمدة شهرية مكدّسة حسب الموقع (اتجاه القراءة من اليمين) --- */
function monthlyChart(series, year){
  const W=680,H=250, padT=26,padB=30, axisW=46, x0=8, x1=W-axisW;
  const plotW=x1-x0, plotH=H-padT-padB, band=plotW/12, barW=Math.min(34, band*0.58);
  const showB = App.site==="الكل" || App.site===SITES[1];
  const showA = App.site==="الكل" || App.site===SITES[0];
  const totals=series.map(m=>m.a+m.b);
  const max=niceMax(Math.max.apply(null,totals.concat([0])));
  const yOf=v=> padT+plotH-(v/max)*plotH;
  let g="";
  for(let i=0;i<=4;i++){
    const v=max*i/4, y=yOf(v);
    g+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>'+
       '<text x="'+(x1+7)+'" y="'+(y+3.5)+'" font-size="10" fill="var(--ink-3)" style="font-variant-numeric:tabular-nums">'+fmt(v)+'</text>';
  }
  let bars="",hits="";
  series.forEach((m,i)=>{
    const j=11-i, cx=x0+j*band+band/2, x=cx-barW/2;
    const a=m.a,b=m.b,t=a+b;
    let cursorY=padT+plotH;
    if(showA && a>0){
      const h=(a/max)*plotH, y=cursorY-h;
      const top = !(showB&&b>0);
      bars += top ? '<path d="'+roundedTop(x,y,barW,h,4)+'" fill="var(--site-a)"/>'
                  : '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" fill="var(--site-a)"/>';
      cursorY=y-2;
    }
    if(showB && b>0){
      const h=(b/max)*plotH, y=cursorY-h;
      bars += '<path d="'+roundedTop(x,y,barW,h,4)+'" fill="var(--site-b)"/>';
      cursorY=y;
    }
    if(t>0) bars+='<text x="'+cx+'" y="'+(cursorY-6)+'" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--ink-2)" style="font-variant-numeric:tabular-nums">'+fmt(t)+'</text>';
    bars+='<text x="'+cx+'" y="'+(H-12)+'" font-size="9.5" text-anchor="middle" fill="var(--ink-3)">'+MONTHS[i]+'</text>';
    const rows=(showA?'<div class="t-r"><span><i style="background:var(--site-a)"></i>'+SITES[0]+'</span><b>'+fmt(a)+'</b></div>':'')+
               (showB?'<div class="t-r"><span><i style="background:var(--site-b)"></i>'+SITES[1]+'</span><b>'+fmt(b)+'</b></div>':'')+
               '<div class="t-r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>الإجمالي</span><b>'+fmt(t)+'</b></div>';
    hits+='<rect x="'+(x0+j*band)+'" y="'+padT+'" width="'+band+'" height="'+plotH+'" fill="transparent"'+
          tipAttr('<div class="t-h">'+MONTHS[i]+" "+year+'</div>'+rows)+'/>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="حجم أوامر الصيانة الشهري لسنة '+year+'">'+
    g+'<line x1="'+x0+'" y1="'+(padT+plotH)+'" x2="'+x1+'" y2="'+(padT+plotH)+'" stroke="var(--line-2)" stroke-width="1"/>'+
    bars+hits+'</svg>';
}

/* --- أشرطة أفقية (HTML، تقرأ من اليمين) --- */
function hbars(items, opt){
  opt=opt||{};
  const max=Math.max.apply(null,items.map(i=>i.value).concat([1]));
  const total=items.reduce((s,i)=>s+i.value,0)||1;
  if(!items.length) return '<div class="empty" style="padding:24px">لا توجد بيانات في هذا النطاق</div>';
  return '<div class="hbars">'+items.map(it=>{
    const pct=(it.value/max)*100;
    const share=Math.round((it.value/total)*100);
    const col=it.color||"var(--accent)";
    return '<div class="hb"'+tipAttr('<div class="t-h">'+esc(it.label)+'</div><div class="t-r"><span>'+esc(opt.unit||"عدد الأوامر")+'</span><b>'+fmt(it.value)+'</b></div><div class="t-r"><span>النسبة</span><b>'+share+'%</b></div>')+'>'+
      '<div class="hb-l" title="'+esc(it.label)+'">'+esc(it.label)+'</div>'+
      '<div class="hb-t"><i style="width:'+pct.toFixed(1)+'%;background:'+col+'"></i></div>'+
      '<div class="hb-v num">'+fmt(it.value)+'</div>'+
    '</div>';
  }).join("")+'</div>';
}
function simpleTable(head, rows){
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+head.map(h=>'<th>'+esc(h)+'</th>').join("")+
    '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i?' class="r num"':'')+'>'+esc(c)+'</td>').join("")+'</tr>').join("")+
    '</tbody></table></div>';
}
function chartCard(o){
  return '<section class="card chart-box-wrap">'+
    '<div class="card-h"><h3>'+esc(o.title)+'</h3><div class="sp">'+
      '<button class="btn ghost sm no-print" data-table-toggle>جدول</button></div></div>'+
    (o.sub?'<div class="card-sub">'+esc(o.sub)+'</div>':'')+
    '<div class="card-b"><div class="chart-box">'+
      '<div class="chart-svg">'+o.chart+'</div>'+
      '<div class="tbl-alt">'+(o.table||"")+'</div>'+
    '</div></div>'+
    (o.legend?'<div class="legend">'+o.legend+'</div>':'')+
  '</section>';
}
function siteLegend(){
  const p=[];
  if(App.site==="الكل"||App.site===SITES[0]) p.push('<span><i style="background:var(--site-a)"></i>'+SITES[0]+'</span>');
  if(App.site==="الكل"||App.site===SITES[1]) p.push('<span><i style="background:var(--site-b)"></i>'+SITES[1]+'</span>');

function mountCharts(root){
  $$("[data-table-toggle]",root).forEach(b=>{
    b.onclick=()=>{
      const box=$(".chart-box", b.closest(".card"));
      const on=box.classList.toggle("as-table");
      b.textContent = on ? "رسم" : "جدول";
    };
  });
  const tip=$("#tip");
  $$("[data-tip]",root).forEach(el=>{
    el.addEventListener("mouseenter",()=>{ tip.innerHTML=el.getAttribute("data-tip"); tip.classList.add("on"); });
    el.addEventListener("mousemove",e=>{
      const r=tip.getBoundingClientRect();
      let x=e.clientX-r.width-14; if(x<8) x=e.clientX+14;
      let y=e.clientY-r.height-12; if(y<8) y=e.clientY+16;
      tip.style.left=x+"px"; tip.style.top=y+"px";
    });
    el.addEventListener("mouseleave",()=>tip.classList.remove("on"));
  });
}

function scopedRecords(){ return siteFilter(Store.list("records")); }
function monthSeries(year){
  const recs=scopedRecords();
  return MONTHS.map((_,i)=>{
    const ym=year+"-"+String(i+1).padStart(2,"0");
    const inM=recs.filter(r=>ymOf(r.date)===ym);
    return {a:inM.filter(r=>r.site===SITES[0]).length, b:inM.filter(r=>r.site===SITES[1]).length};
  });
}
function countBy(rows,key,limit){
  const m={};
  rows.forEach(r=>{ const k=r[key]||"غير محدد"; m[k]=(m[k]||0)+1; });
  let arr=Object.keys(m).map(k=>({label:k,value:m[k]})).sort((a,b)=>b.value-a.value);
  if(limit && arr.length>limit){
    const rest=arr.slice(limit-1).reduce((s,x)=>s+x.value,0);
    arr=arr.slice(0,limit-1).concat([{label:"أخرى",value:rest}]);
  }
  return arr;
}

  Store.list("records").forEach(r=>{ if(r.chief) s.add(r.chief); });

    '</tbody></table></div></div></section>' : "";

  return {

      '</div><div class="sp">'+

    mount(root){
      mountCharts(root);
      $("#yrSel",root).onchange=e=>{ App.chartYear=n(e.target.value); render(); };

function filterRecords(){
  const f=App.filters;
  return siteFilter(Store.list("records")).filter(r=>{
    if(f.sector && r.sector!==f.sector) return false;
    if(f.dept && r.dept!==f.dept) return false;
    if(f.floor && r.floor!==f.floor) return false;
    if(f.devType && r.devType!==f.devType) return false;
    if(f.mtype && r.mtype!==f.mtype) return false;

      const hay=[r.no,r.serial,r.tag,r.employee,r.devModel,r.devType,r.notes,r.tech,r.chief,r.dept,r.sector].join(" ").toLowerCase();
      if(hay.indexOf(q)<0) return false;

    return true;
  }).sort((a,b)=>String(b.date+(b.no||"")).localeCompare(String(a.date+(a.no||""))));

function renderParts(box){
  if(!box) return;
  const site=$("#fSite") ? $("#fSite").value : (App.site==="الكل"?SITES[0]:App.site);
  const stock=Store.list("parts").filter(p=>p.site===site);
  box.innerHTML =
    (Draft.parts.length? '<div class="tag-list" style="margin-bottom:9px">'+Draft.parts.map((p,i)=>
      '<span class="tag">'+esc(p.name)+' ×'+fmt(p.qty)+'<button type="button" data-rmpart="'+i+'" aria-label="إزالة">×</button></span>').join("")+'</div>' : '')+
    '<div class="parts-line">'+
      '<select class="inp" id="partSel">'+optionsHTML(stock.map(p=>p.name+" — "+(p.code||"")+" (متوفر "+n(p.qty)+")"),"", "اختر صنفاً من مخزن "+site)+'</select>'+
      '<input class="inp num" type="number" min="1" value="1" id="partQty" aria-label="الكمية">'+
      '<button type="button" class="btn" id="addPart">إضافة</button>'+
    '</div>'+
    (stock.length? '' : '<span class="hint">لا توجد أصناف في مخزن هذا الموقع بعد — أضفها من صفحة المخزن.</span>');
  $$("[data-rmpart]",box).forEach(b=>b.onclick=()=>{ Draft.parts.splice(n(b.dataset.rmpart),1); renderParts(box); });
  const add=$("#addPart",box);
  if(add) add.onclick=()=>{
    const idx=$("#partSel",box).selectedIndex-1;
    if(idx<0){ toast("اختر صنفاً أولاً"); return; }
    const p=stock[idx], q=Math.max(1,n($("#partQty",box).value));
    const ex=Draft.parts.find(x=>x.partId===p.id);
    if(ex) ex.qty=n(ex.qty)+q; else Draft.parts.push({partId:p.id,name:p.name,code:p.code||"",qty:q});
    renderParts(box);
  };
}
async function saveOrder(rec){
  const g=id=>{ const el=$("#"+id); return el?el.value.trim():""; };
  const site=g("fSite"), date=g("fDate");
  const obj={
    id: rec?rec.id:undefined,
    no: rec?rec.no:"",
    site:site, date:date,
    employee:g("fEmp"), sector:g("fSector"), dept:g("fDept"), floor:g("fFloor"),
    devType:g("fDev"), devModel:g("fModel"), serial:g("fSerial"), tag:g("fTag"),
    tech:g("fTech"), chief: rec?(rec.chief||""):"", mtype:g("fMtype"), status:g("fStatus"), notes:g("fNotes"),
    locId:g("fLocId"),
    locName:(byId(Store.list("locations"),g("fLocId"))||{}).name || (rec?(rec.locName||""):""),
    gps: Draft.gps || (rec?(rec.gps||null):null),
    parts:Draft.parts.map(p=>({partId:p.partId,name:p.name,code:p.code||"",qty:n(p.qty)})),
    photoId: rec?rec.photoId:null,
    approvedBy: rec?(rec.approvedBy||null):null,
    approvedAt: rec?(rec.approvedAt||null):null,
    createdAt: rec?rec.createdAt:new Date().toISOString()
  };
  if(!obj.employee||!obj.devType||!obj.tech||!obj.mtype){ toast("أكمل الحقول المطلوبة"); return; }
  const btn=$("#saveOrd"); if(btn){ btn.disabled=true; btn.textContent="جارٍ الحفظ…"; }
  try{
    if(!obj.no) obj.no=await Store.nextNo(site,date);
    /* الصورة */
    const oldSite = rec ? rec.site : site;
    if(Draft.photoDirty){
      if(Draft.photo){
        if(obj.photoId && oldSite!==site) await Store.delPhoto(oldSite,obj.photoId);
        const pid=obj.photoId||uid("ph");
        const okPhoto=await Store.savePhoto(site,pid,Draft.photo);
        obj.photoId = (okPhoto===false) ? null : pid;
      }else if(obj.photoId){ await Store.delPhoto(oldSite,obj.photoId); obj.photoId=null; }
    }else if(obj.photoId && oldSite!==site){
      /* نُقل الأمر إلى موقع آخر: تنتقل صورته معه إلى قاعدة ذلك الموقع */
      const url=await Store.getPhoto(oldSite,obj.photoId);
      if(url){ await Store.savePhoto(site,obj.photoId,url); await Store.delPhoto(oldSite,obj.photoId); }
    }
    /* فروق قطع الغيار → حركات مخزن */
    const oldMap={}, newMap={};
    ((rec&&rec.parts)||[]).forEach(p=>{ oldMap[p.partId]=(oldMap[p.partId]||0)+n(p.qty); });
    obj.parts.forEach(p=>{ newMap[p.partId]=(newMap[p.partId]||0)+n(p.qty); });
    const ids=Array.from(new Set(Object.keys(oldMap).concat(Object.keys(newMap))));
    for(const pid of ids){
      const delta=n(newMap[pid])-n(oldMap[pid]);
      if(!delta) continue;
      const part=byId(Store.list("parts"),pid); if(!part) continue;
      await Store.save("parts", Object.assign({},part,{qty:n(part.qty)-delta}));
      await Store.save("movements",{
        ts:new Date().toISOString(), partId:pid, partName:part.name, code:part.code||"",
        type: delta>0?"صرف":"إرجاع", qty:Math.abs(delta), site:site, tech:obj.tech,
        recordNo:obj.no, note: delta>0?"صرف على أمر صيانة":"تعديل أمر صيانة"
      });
    }
    await Store.save("records",obj);
    toast(rec?"تم حفظ التعديلات":"تم تسجيل الأمر "+obj.no);
    App.params={}; go("records");
  }catch(e){
    console.error(e); toast("تعذّر الحفظ — حاول مرة أخرى");
    if(btn){ btn.disabled=false; btn.textContent="تسجيل أمر الصيانة"; }
  }
}

/* ---------- أدوات التقرير الشهري ---------- */
const ORD=["أولاً","ثانياً","ثالثاً","رابعاً","خامساً","سادساً","سابعاً"];
function scopeCode(){ return App.site==="الكل" ? "ALL" : (SITE_CODE[App.site]||"ALL"); }
function reportId(ym,code){ return String(ym).replace("-","")+"_"+(code||scopeCode()); }
function reportNo(ym,code){ return "TR-"+String(ym).slice(2,4)+String(ym).slice(5,7)+"-"+(code||scopeCode()); }
function reportDoc(ym,code){ return byId(Store.list("reports"), reportId(ym,code)); }
function ymBack(k){ const d=new Date(); const x=new Date(d.getFullYear(), d.getMonth()-k, 1); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"); }
function prevYm(){ return ymBack(1); }
function monthEndNear(){
  const d=new Date(), last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return d.getDate()>=last-2;
}
function reportSummary(ym){
  const allow=allowedSites();
  const inMonth=Store.list("records").filter(r=>ymOf(r.date)===ym && allow.indexOf(r.site)>=0);
  const s=siteFilter(inMonth);
  const done=s.filter(r=>r.status==="منجز").length;
  return {
    ym:ym, total:s.length, done:done,
    pending:s.filter(r=>r.status!=="منجز"&&r.status!=="ملغي").length,
    waiting:s.filter(r=>r.status==="بانتظار قطعة").length,
    devices:new Set(s.map(r=>(r.serial||"").trim()).filter(Boolean)).size,
    parts:s.reduce((a,r)=>a+(r.parts||[]).reduce((x,p)=>x+n(p.qty),0),0),
    approved:s.filter(r=>r.approvedAt).length,
    pct: s.length?Math.round(done/s.length*100):0,
    bySite: allow.map(x=>{
      const rows=inMonth.filter(r=>r.site===x);
      const d2=rows.filter(r=>r.status==="منجز").length;
      return {site:x, total:rows.length, done:d2, pct: rows.length?Math.round(d2/rows.length*100):0};
    })
  };
}
function reportText(ym){
  const m=reportSummary(ym);
  const L=[];
  L.push("تقرير صيانة الأجهزة — "+monthLabel(ym));
  L.push("وزارة الأشغال العامة · إدارة نظم المعلومات");
  L.push("النطاق: "+(App.site==="الكل"?"المبنى الرئيسي والمركز الحكومي":App.site));
  L.push("رقم التقرير: "+reportNo(ym));
  L.push("تاريخ الإصدار: "+today());
  L.push("");
  L.push("الملخص:");
  L.push("- إجمالي الأوامر: "+fmt(m.total));
  L.push("- منجزة: "+fmt(m.done)+" ("+m.pct+"%)");
  L.push("- قيد التنفيذ: "+fmt(m.pending));
  L.push("- بانتظار قطعة غيار: "+fmt(m.waiting));
  L.push("- أجهزة مشمولة: "+fmt(m.devices));
  L.push("- قطع غيار مصروفة: "+fmt(m.parts));
  L.push("- معتمدة: "+fmt(m.approved));
  if(m.bySite.length>1){
    L.push("");
    L.push("حسب الموقع:");
    m.bySite.forEach(b=>L.push("- "+b.site+": "+fmt(b.total)+" أمر، منجزة "+fmt(b.done)+" ("+b.pct+"%)"));
  }
  L.push("");
  L.push("رئيس القسم: "+Access.chiefName());
  return L.join("\n");
}
function monthEndNotice(){
  const p=prevYm();
  const unsentPrev=!reportDoc(p);
  const unsentCur=!reportDoc(ymOf(today()));
  if(Access.isChief()) return "";
  if(unsentPrev)
    return '<div class="notice warn"><b>تقرير '+esc(monthLabel(p))+' لم يُرسل بعد</b> — يُرسل تلقائياً خلال لحظات إن وُجدت أوامر في ذلك الشهر.'+
      '<button class="btn sm" data-goto-rep="'+p+'">فتح التقرير</button></div>';
  if(monthEndNear() && unsentCur)
    return '<div class="notice"><b>الشهر يوشك على الانتهاء</b> — سيُرتَّب تقرير '+esc(monthLabel(ymOf(today())))+' ويُرسل تلقائياً إلى رئيس القسم عند أول دخول بعد نهايته.'+
      '<button class="btn sm" data-goto-rep="'+ymOf(today())+'">فتح التقرير</button></div>';
  return "";
}
/* ترتيب التقرير قبل الإرسال: أقسام ثابتة الترتيب، وقوائم مرتبة تنازلياً، وأوامر مرتبة بالتاريخ */
function arrangeReport(ym){
  const allow=allowedSites();
  const recs=siteFilter(Store.list("records").filter(r=>ymOf(r.date)===ym && allow.indexOf(r.site)>=0))
    .slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)) || String(a.no||"").localeCompare(String(b.no||"")));
  const top=(key,k)=>countBy(recs,key,k||8).map(x=>({label:x.label, value:x.value}));
  const partsMap={};
  recs.forEach(r=>(r.parts||[]).forEach(p=>{ partsMap[p.name]=(partsMap[p.name]||0)+n(p.qty); }));
  const parts=Object.keys(partsMap).map(k=>({label:k, value:partsMap[k]})).sort((a,b)=>b.value-a.value).slice(0,15);
  const open=recs.filter(r=>r.status!=="منجز"&&r.status!=="ملغي").slice(0,30)
    .map(r=>({no:r.no||"", date:r.date||"", dev:r.devType||"", tech:r.tech||"", status:r.status||""}));
  return {
    sections:[
      {k:"byType",   t:"حسب نوع الصيانة",     rows:top("mtype",6)},
      {k:"byDept",   t:"حسب القسم",            rows:top("dept")},
      {k:"byTech",   t:"حسب الفني",            rows:top("tech")},
      {k:"byDevice", t:"حسب نوع الجهاز",       rows:top("devType")},
      {k:"byLoc",    t:"حسب موقع العمل",       rows:countBy(recs.filter(r=>r.locName),"locName",8).map(x=>({label:x.label, value:x.value}))},
      {k:"parts",    t:"قطع الغيار المصروفة",  rows:parts},
      {k:"open",     t:"أوامر لم تُنجز",        list:open}
    ],
    firstDate: recs.length ? recs[0].date : "",
    lastDate:  recs.length ? recs[recs.length-1].date : "",
    arrangedAt: new Date().toISOString()
  };
}
async function sendReport(ym,note,opt){
  opt=opt||{};
  const m=reportSummary(ym);
  const id=reportId(ym);
  await Store.save("reports", Object.assign({}, m, {
    id:id, no:reportNo(ym), scope:scopeCode(),
    site: App.site==="الكل" ? "" : App.site,
    coverage: App.site==="الكل" ? "المبنى الرئيسي والمركز الحكومي" : App.site,
    arranged: arrangeReport(ym),
    auto: !!opt.auto,
    sentAt:new Date().toISOString(),
    sentBy: opt.auto ? "إرسال تلقائي — "+Access.label() : Access.label(),
    note:note||"", readAt:null, readBy:"", ackNote:""
  }));
  if(!opt.silent){ toast("أُرسل تقرير "+monthLabel(ym)+" إلى رئيس القسم"); render(); }
}
/* الإرسال التلقائي: عند أول دخول بعد نهاية الشهر تُرسل تقارير الأشهر المنتهية غير المرسلة */
const AutoRep={done:{}, timer:null, running:false};
function scheduleAutoReports(){
  if(!Store.ready || !Store.sitesReady || !Access.in() || Access.isChief() || !Access.hasChief()) return;
  clearTimeout(AutoRep.timer);
  AutoRep.timer=setTimeout(runAutoReports, 3000);
}
async function runAutoReports(){
  if(AutoRep.running || !Access.in() || Access.isChief() || !Access.hasChief()) return;
  const site=homeSite();
  if(SITES.indexOf(site)<0) return;
  const key=Access.state.scope+"|"+site;
  if(AutoRep.done[key]) return;
  AutoRep.running=true;
  let sent=0;
  const keepSite=App.site;
  try{
    App.site=site;
    for(let k=1;k<=3;k++){
      const ym=ymBack(k);
      if(!Store.list("records").some(r=>r.site===site && ymOf(r.date)===ym)) continue;
      if(await Store.exists("reports", reportId(ym, SITE_CODE[site]), site)) continue;
      await sendReport(ym, "", {auto:true, silent:true});
      sent++;
    }
    AutoRep.done[key]=true;
  }catch(e){ console.warn("auto-report", e); }
  finally{ App.site=keepSite; AutoRep.running=false; }
  if(sent){ toast("أُرسل "+fmt(sent)+" تقرير شهري مرتّب تلقائياً إلى رئيس القسم"); render(); }
}

const LATE_DAYS=7;
function daysSince(d){
  const t=new Date(String(d)+"T00:00:00").getTime();
  if(isNaN(t)) return 0;
  return Math.max(0, Math.floor((Date.now()-t)/86400000));
}
function isOpen(r){ return r.status==="مفتوح"||r.status==="قيد التنفيذ"; }
async function approveMany(ids){
  let k=0;
  for(const id of ids){
    const r=byId(Store.list("records"),id);
    if(!r || r.approvedAt) continue;
    await Store.save("records", Object.assign({},r,{
      chief: r.chief || Access.chiefName(),
      approvedBy: Access.chiefName(), approvedAt: new Date().toISOString()
    }));
    k++;
  }
  toast(k?("تم اعتماد "+fmt(k)+" أمر"):"لا يوجد ما يُعتمد");
  render();
}

/* تغيير كلمة سر جهة — يعيد نص الخطأ أو null عند النجاح */
async function pwChange(target,verifyKey,cur,a,b){
  if(Access.auth()){
    /* Firebase: كل جهة تغيّر كلمة سر حسابها وحدها بعد التحقق بالكلمة الحالية */
    if(target!==Access.state.scope) return "كلمة سر كل جهة تُغيَّر بعد الدخول بحسابها نفسه.";
    if(a.length<6) return "كلمة السر الجديدة يجب ألا تقل عن ٦ أحرف.";
    if(a!==b) return "كلمتا السر غير متطابقتين.";
    if(!cur) return "أدخل كلمة السر الحالية.";
    return await Store.authChangePassword(cur,a);
  }
  if(a.length<4) return "كلمة السر الجديدة يجب ألا تقل عن ٤ أحرف.";
  if(a!==b) return "كلمتا السر غير متطابقتين.";
  if(!cur) return verifyKey===ADMIN_KEY ? "أدخل كلمة سر مشرف الفريق للتحقق." : "أدخل كلمة السر الحالية.";
  if(!(await Access.checkAny(verifyKey,cur)).ok)
    return verifyKey===ADMIN_KEY ? "كلمة سر مشرف الفريق غير صحيحة." : "كلمة السر الحالية غير صحيحة.";
  for(const t of PW_TARGETS){
    if(t.k!==target && await Access.check(t.k,a)) return "هذه الكلمة مستخدمة لـ«"+t.nm+"» — اختر كلمة مختلفة لكل جهة.";
  }
  await Access.setMany([[target,a]]);
  return null;
}
function securityNote(){
  if(Access.auth()) return '<p class="note" style="margin-top:14px">الحماية مطبّقة على خادم Firebase: '+
    'قواعد الأمان لا تسمح لحساب أي موقع بقراءة بيانات الموقع الآخر أو تعديلها، وحساب رئيس القسم وحده يصل إلى القاعدتين. '+
    'إن نُسيت كلمة سر جهة: احذف حسابها من Firebase Console ← Authentication وأنشئه من جديد بالبريد نفسه.</p>';
  return '<p class="note" style="margin-top:14px">كلمات السر تفصل الجهات على مستوى الاستخدام اليومي. '+
  'لكل موقع قاعدة بيانات منفصلة لا تُفتح إلا لجهته، وتُجمع القاعدتان عند رئيس القسم فقط. '+
  'مع ذلك هذه ليست حماية أمنية كاملة — الفصل يتم داخل النظام، ومن يملك خبرة تقنية ويصل إلى الرابط يستطيع تجاوزه. '+
  'للحماية على مستوى الخادم استخدم نسخة Firebase.</p>';
}

const LIST_DEFS=[
  {k:"sectors",  t:"القطاعات",           field:"sector"},
  {k:"depts",    t:"الأقسام",             field:"dept"},
  {k:"floorsA",  t:"طوابق "+SITES[0],     field:"floor", site:SITES[0]},
  {k:"floorsB",  t:"طوابق "+SITES[1],     field:"floor", site:SITES[1]},
  {k:"devTypes", t:"أنواع الأجهزة",       field:"devType", recOnly:true},
  {k:"mtypes",   t:"أنواع الصيانة",       field:"mtype",   recOnly:true, hint:"ترتيبها يحدد ألوان الرسوم البيانية"}
];
function listGet(d){ const c=Store.config; return d.site ? (((c.floors||{})[d.site])||[]) : (c[d.k]||[]); }
function listCfg(d,arr){
  const cfg=JSON.parse(JSON.stringify(Store.config));
  if(d.site){ cfg.floors=cfg.floors||{}; cfg.floors[d.site]=arr; } else cfg[d.k]=arr;
  return cfg;
}
function listUsage(d,v){
  const match=x=>x[d.field]===v && (!d.site || x.site===d.site) && (!x.site || canManage(x.site));
  return {
    recs: Store.list("records").filter(match).length,
    emps: d.recOnly ? 0 : Store.list("employees").filter(match).length
  };
}
function supLists(){
  return {
    html:'<div class="le-grid">'+LIST_DEFS.filter(d=>!d.site||canManage(d.site)).map(d=>{
      const arr=listGet(d);
      return '<section class="card le-card"><div class="card-h"><h3>'+esc(d.t)+'</h3><span class="chip">'+fmt(arr.length)+'</span></div>'+
        (d.hint?'<div class="card-sub">'+esc(d.hint)+'</div>':'')+
        '<div class="card-b"><div class="le-list">'+
          (arr.length ? arr.map((v,i)=>{
            const u=listUsage(d,v);
            const use=[u.emps?fmt(u.emps)+" موظف":"", u.recs?fmt(u.recs)+" أمر":""].filter(Boolean).join(" · ");
            return '<div class="le-row"><span class="nm">'+esc(v)+'</span>'+
              (use?'<span class="use">'+esc(use)+'</span>':'')+
              '<button class="btn sm ghost" data-ren="'+d.k+'|'+i+'">تعديل</button>'+
              '<button class="btn sm ghost danger" data-del="'+d.k+'|'+i+'">حذف</button></div>';
          }).join("") : '<div class="empty" style="padding:16px">القائمة فارغة</div>')+
        '</div>'+
        '<div class="le-add"><input class="inp" id="add_'+d.k+'" placeholder="إضافة إلى '+esc(d.t)+'…">'+
          '<button class="btn sm" data-add="'+d.k+'">إضافة</button></div>'+
      '</div></section>';
    }).join("")+'</div>',
    mount(root){
      const def=k=>LIST_DEFS.find(d=>d.k===k);
      $$("[data-add]",root).forEach(b=>{
        const d=def(b.dataset.add), inp=$("#add_"+d.k,root);
        const add=async()=>{
          const v=inp.value.trim();
          if(!v){ toast("اكتب الاسم أولاً"); return; }
          const arr=listGet(d);
          if(arr.indexOf(v)>=0){ toast("«"+v+"» موجود مسبقاً"); return; }
          await Store.saveConfig(listCfg(d, arr.concat([v])));
          toast("أُضيف «"+v+"» إلى "+d.t); render();
        };
        b.onclick=add;
        inp.onkeydown=e=>{ if(e.key==="Enter") add(); };
      });
      $$("[data-del]",root).forEach(b=>b.onclick=()=>{
        const [k,i]=b.dataset.del.split("|"); const d=def(k); const arr=listGet(d); const v=arr[n(i)];
        const u=listUsage(d,v);
        const inUse=(u.emps||u.recs) ? " مستخدم في "+[u.emps?fmt(u.emps)+" موظف":"",u.recs?fmt(u.recs)+" أمر صيانة":""].filter(Boolean).join(" و")+" — تبقى تلك البيانات كما هي." : "";
        confirmBox("حذف من "+d.t,"سيُحذف «"+v+"» من القائمة."+inUse,async()=>{
          const next=arr.slice(); next.splice(n(i),1);
          await Store.saveConfig(listCfg(d,next)); toast("تم الحذف"); render();
        });
      });
      $$("[data-ren]",root).forEach(b=>b.onclick=()=>{
        const [k,i]=b.dataset.ren.split("|"); const d=def(k); const arr=listGet(d); const old=arr[n(i)];
        const u=listUsage(d,old);
        openModal({
          title:"تعديل «"+old+"»",
          body:'<div class="field"><label for="renVal">الاسم الجديد</label><input class="inp" id="renVal" value="'+esc(old)+'"></div>'+
            ((u.emps||u.recs)
              ? '<label class="check" style="margin-top:12px"><input type="checkbox" id="renCascade" checked> تحديث البيانات المرتبطة ('+
                [u.emps?fmt(u.emps)+" موظف":"",u.recs?fmt(u.recs)+" أمر صيانة":""].filter(Boolean).join(" و")+')</label>'
              : '')+
            (d.site ? '' : '<p class="hint" style="margin-top:10px">هذه القائمة مشتركة بين الموقعين؛ تحديث البيانات المرتبطة يشمل '+esc(manageSites().join("، "))+' فقط.</p>'),
          actions:[
            {label:"إلغاء", cls:"btn", act:closeModal},
            {label:"حفظ", cls:"btn pri", act:async()=>{
              const v=$("#renVal").value.trim();
              const cascade=!!($("#renCascade") && $("#renCascade").checked);
              if(!v){ toast("الاسم مطلوب"); return; }
              if(v===old){ closeModal(); return; }
              if(arr.indexOf(v)>=0){ toast("«"+v+"» موجود مسبقاً"); return; }
              closeModal();
              const next=arr.slice(); next[n(i)]=v;
              const cfgR=listCfg(d,next);
              if(d.k==="depts" && cfgR.deptLocs){
                manageSites().forEach(site=>{
                  const m=cfgR.deptLocs[site];
                  if(m && m[old]!==undefined){ m[v]=m[old]; delete m[old]; }
                });
              }
              await Store.saveConfig(cfgR);
              let k2=0;
              if(cascade){
                const match=x=>x[d.field]===old && (!d.site || x.site===d.site) && (!x.site || canManage(x.site));
                const cols = d.recOnly ? ["records"] : ["employees","records"];
                for(const col of cols){
                  for(const x of Store.list(col).filter(match)){
                    const upd=Object.assign({},x); upd[d.field]=v;
                    await Store.save(col,upd); k2++;
                  }
                }
              }
              toast("تم التعديل"+(k2?" وتحديث "+fmt(k2)+" سجلاً مرتبطاً":"")); render();
            }}
          ]
        });
      });
    }
  };
}

/* ============================================================
   16.7 مواقع العمل والخريطة
   ============================================================ */
function toRad(d){ return d*Math.PI/180; }
/* المسافة بالأمتار بين نقطتين */
function geoDist(a,b){
  if(!a||!b||!isFinite(a.lat)||!isFinite(b.lat)) return Infinity;
  const R=6371000, dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return Math.round(2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)));
}
function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(m<10000?1:0)+" كم" : fmt(m)+" م"; }
function fmtCoord(v){ return isFinite(v) ? Number(v).toFixed(5) : ""; }
/* يقبل «29.37,47.97» أو رابط خرائط Google */
function parseLatLng(str){
  const m=String(str||"").match(/(-?\d{1,2}\.\d+)\s*[,\s]\s*(-?\d{1,3}\.\d+)/);
  if(!m) return null;
  const lat=parseFloat(m[1]), lng=parseFloat(m[2]);
  if(Math.abs(lat)>90||Math.abs(lng)>180) return null;
  return {lat:lat, lng:lng};
}
function mapsUrl(lat,lng){ return "https://www.google.com/maps?q="+fmtCoord(lat)+","+fmtCoord(lng); }
function mapsLink(lat,lng,label){
  if(!isFinite(lat)||!isFinite(lng)) return "—";
  return '<a href="'+mapsUrl(lat,lng)+'" target="_blank" rel="noopener">'+esc(label||"فتح في خرائط Google")+'</a>'+
    ' <span class="mono" style="color:var(--ink-3);font-size:11.5px">'+fmtCoord(lat)+", "+fmtCoord(lng)+'</span>';
}
function scopedLocations(){ return Store.list("locations").filter(l=>allowedSites().indexOf(l.site)>=0); }

/* ---- مخطط المواقع (يُرسم داخل الصفحة بلا خرائط خارجية) ---- */
function geoMap(points, opt){
  opt=opt||{};
  const pts=(points||[]).filter(p=>isFinite(p.lat)&&isFinite(p.lng));
  if(!pts.length) return '<div class="empty" style="padding:26px">'+esc(opt.empty||"لا توجد مواقع بإحداثيات بعد")+'</div>';
  const W=opt.w||660, H=opt.h||330, pad=30;
  let minLat=Math.min.apply(null,pts.map(p=>p.lat)), maxLat=Math.max.apply(null,pts.map(p=>p.lat));
  let minLng=Math.min.apply(null,pts.map(p=>p.lng)), maxLng=Math.max.apply(null,pts.map(p=>p.lng));
  const cLat=(minLat+maxLat)/2, kx=Math.cos(toRad(cLat))||1;
  const MIN_LAT_SPAN=0.0035;
  if(maxLat-minLat<MIN_LAT_SPAN){ const c=(minLat+maxLat)/2; minLat=c-MIN_LAT_SPAN/2; maxLat=c+MIN_LAT_SPAN/2; }
  const minLngSpan=MIN_LAT_SPAN/kx;
  if(maxLng-minLng<minLngSpan){ const c=(minLng+maxLng)/2; minLng=c-minLngSpan/2; maxLng=c+minLngSpan/2; }
  const midLat=(minLat+maxLat)/2, midLng=(minLng+maxLng)/2;
  const sc=Math.min((W-2*pad)/((maxLng-minLng)*kx), (H-2*pad)/(maxLat-minLat));
  const X=lng=>W/2+((lng-midLng)*kx)*sc;
  const Y=lat=>H/2-((lat-midLat))*sc;
  const mPerPx=111320/sc;

  let grid="";
  for(let i=1;i<4;i++){
    const gx=pad+i*(W-2*pad)/4, gy=pad+i*(H-2*pad)/4;
    grid+='<line x1="'+gx+'" y1="'+pad+'" x2="'+gx+'" y2="'+(H-pad)+'" stroke="var(--grid)" stroke-width="1"/>'+
          '<line x1="'+pad+'" y1="'+gy+'" x2="'+(W-pad)+'" y2="'+gy+'" stroke="var(--grid)" stroke-width="1"/>';
  }
  const nice=[10,25,50,100,250,500,1000,2000,5000];
  let barM=nice[0];
  for(const v of nice){ if(v/mPerPx<=150) barM=v; }
  const barPx=Math.round(barM/mPerPx);
  const scaleBar='<g transform="translate('+pad+','+(H-14)+')">'+
    '<line x1="0" y1="0" x2="'+barPx+'" y2="0" stroke="var(--ink-3)" stroke-width="2"/>'+
    '<line x1="0" y1="-4" x2="0" y2="4" stroke="var(--ink-3)" stroke-width="2"/>'+
    '<line x1="'+barPx+'" y1="-4" x2="'+barPx+'" y2="4" stroke="var(--ink-3)" stroke-width="2"/>'+
    '<text x="'+(barPx+7)+'" y="4" font-size="10.5" fill="var(--ink-3)">'+fmtDist(barM)+'</text></g>';

  let marks="";
  pts.forEach(p=>{
    const x=X(p.lng), y=Y(p.lat);
    const tip=tipAttr(p.tip||('<div class="t-h">'+esc(p.label||"")+'</div>'+
      (p.sub?'<div class="t-r"><span>'+esc(p.sub)+'</span></div>':'')+
      '<div class="t-r"><span>الإحداثيات</span><b>'+fmtCoord(p.lat)+", "+fmtCoord(p.lng)+'</b></div>'));
    if(p.kind==="gps"){
      marks+='<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="'+(p.color||"var(--c2)")+'" fill-opacity=".85" stroke="var(--surface)" stroke-width="1.5"'+tip+'/>';
    }else if(p.kind==="me"){
      marks+='<circle cx="'+x+'" cy="'+y+'" r="13" fill="var(--accent)" fill-opacity=".14"/>'+
        '<circle cx="'+x+'" cy="'+y+'" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"'+tip+'/>'+
        '<text x="'+x+'" y="'+(y-16)+'" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--accent)">موقعك</text>';
    }else{
      const col=p.color||(p.site===SITES[1]?"var(--site-b)":"var(--site-a)");
      marks+='<g class="map-pin'+(p.sel?" on":"")+'"'+(opt.pick?' data-pinloc="'+esc(p.id||"")+'" style="cursor:pointer"':'')+tip+'>'+
        '<circle cx="'+x+'" cy="'+y+'" r="'+(p.sel?11:8)+'" fill="'+col+'" fill-opacity="'+(p.sel?".28":".18")+'"/>'+
        '<circle cx="'+x+'" cy="'+y+'" r="'+(p.sel?6.5:5)+'" fill="'+col+'" stroke="var(--surface)" stroke-width="2"/>'+
        '<text x="'+x+'" y="'+(y-13)+'" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--ink-2)">'+esc(p.label||"")+'</text></g>';
    }
  });
  return '<svg class="geo-map" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="مخطط المواقع">'+
    '<rect x="'+pad+'" y="'+pad+'" width="'+(W-2*pad)+'" height="'+(H-2*pad)+'" fill="var(--surface-2)" stroke="var(--line)" rx="8"/>'+
    grid+marks+scaleBar+'</svg>';
}

/* ---- اختيار موقع العمل داخل نموذج أمر الصيانة ---- */
function locPoints(sel, me){
  const pts=scopedLocations().filter(l=>isFinite(n(l.lat))&&n(l.lat)!==0).map(l=>({
    lat:n(l.lat), lng:n(l.lng), label:l.name, site:l.site, id:l.id, sel:l.id===sel,
    sub:l.site+(deptsAt(l.id).length?" · "+deptsAt(l.id).join("، "):"")+(l.note?" · "+l.note:"")
  }));
  if(me && isFinite(me.lat)) pts.push({lat:me.lat, lng:me.lng, kind:"me", label:"موقعك الحالي",
    sub:me.acc?("دقة ±"+fmt(me.acc)+" م"):""});
  return pts;
}
function locPickerHTML(rec){
  const locs=scopedLocations();
  const sel=rec?(rec.locId||""):"";
  if(!locs.length){
