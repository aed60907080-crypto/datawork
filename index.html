  }
  return '<div class="field wide"><label>موقع العمل — اختر من الخريطة</label>'+
    '<div class="map-wrap" id="locMap">'+geoMap(locPoints(sel, Draft.gps), {pick:true, empty:"المواقع المسجّلة بلا إحداثيات — أضِفها من تبويب مواقع العمل"})+'</div>'+
    '<div class="loc-chips" id="locChips">'+locs.map(l=>
      '<button type="button" class="chip-btn'+(l.id===sel?" on":"")+'" data-pickloc="'+esc(l.id)+'">'+
      '<span class="sq '+siteClass(l.site)+'"></span>'+esc(l.name)+'</button>').join("")+'</div>'+
    '<div class="loc-bar">'+
      '<button type="button" class="btn sm" id="gpsBtn">'+
        '<svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/></svg>تحديد موقعي (GPS)</button>'+
      '<span class="hint" id="gpsInfo">'+(rec&&rec.gps?"إحداثيات محفوظة مع السجل: "+fmtCoord(rec.gps.lat)+", "+fmtCoord(rec.gps.lng):"")+'</span>'+
    '</div>'+
    '<input type="hidden" id="fLocId" value="'+esc(sel)+'">'+
  '</div>';
}
function mountLocPicker(root){
  const wrap=$("#locMap",root);
  const info=$("#gpsInfo",root);
  const paint=()=>{
    const sel=$("#fLocId",root).value;
    if(wrap) wrap.innerHTML=geoMap(locPoints(sel, Draft.gps), {pick:true});
    $$("[data-pickloc]",root).forEach(b=>b.classList.toggle("on", b.dataset.pickloc===sel));
    if(wrap) mountCharts(wrap);
    $$("[data-pinloc]",wrap||root).forEach(p=>p.onclick=()=>choose(p.dataset.pinloc));
  };
  const choose=id=>{
    const l=byId(Store.list("locations"),id); if(!l) return;
    $("#fLocId",root).value=l.id;
    const siteSel=$("#fSite",root);
    if(siteSel && l.site && siteSel.value!==l.site && allowedSites().indexOf(l.site)>=0){
      siteSel.value=l.site;
      if(siteSel.onchange) siteSel.onchange({target:siteSel});
    }
    paint();
  };
  $$("[data-pickloc]",root).forEach(b=>b.onclick=()=>choose(b.dataset.pickloc));
  paint();
  const btn=$("#gpsBtn",root);
  if(btn) btn.onclick=()=>{
    if(!navigator.geolocation){ info.textContent="هذا الجهاز لا يدعم تحديد الموقع."; return; }
    btn.disabled=true; info.textContent="جارٍ تحديد الموقع…";
    navigator.geolocation.getCurrentPosition(p=>{
      btn.disabled=false;
      Draft.gps={lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy||0), at:new Date().toISOString()};
      const near=scopedLocations().filter(l=>isFinite(n(l.lat)))
        .map(l=>({l:l, d:geoDist(Draft.gps,{lat:n(l.lat),lng:n(l.lng)})}))
        .sort((a,b)=>a.d-b.d)[0];
      if(near && near.d<=n(near.l.radius||200)){
        choose(near.l.id);
        info.textContent="أنت داخل «"+near.l.name+"» — على بعد "+fmtDist(near.d);
      }else{
        paint();
        info.textContent = near ? ("أقرب موقع مسجّل: "+near.l.name+" على بعد "+fmtDist(near.d)+" — اختر الموقع يدوياً")
                                : ("تم تحديد موقعك: "+fmtCoord(Draft.gps.lat)+", "+fmtCoord(Draft.gps.lng));
      }
    },err=>{
      btn.disabled=false;
      info.textContent = err && err.code===1
        ? "لم يُسمح بالوصول إلى الموقع — فعّل الإذن في المتصفح أو اختر الموقع من الخريطة."
        : "تعذّر تحديد الموقع — اختر الموقع من الخريطة.";
    },{enableHighAccuracy:true, timeout:12000, maximumAge:0});
  };
}

/* الموقع المحدد لقسم داخل مبنى */
function deptLocFor(site,dept){
  const id=(((Store.config.deptLocs||{})[site])||{})[dept];
  return (id && byId(Store.list("locations"),id)) ? id : "";
}
/* الأقسام المرتبطة بموقع */
function deptsAt(locId){
  const out=[], all=Store.config.deptLocs||{};
  Object.keys(all).forEach(site=>Object.keys(all[site]||{}).forEach(d=>{ if(all[site][d]===locId) out.push(d); }));
  return out;
}
/* في نموذج الأمر: اختيار موقع القسم تلقائياً إن لم يُختر موقع بعد */

    if(info) info.textContent="اختير موقع «"+d.value+"» تلقائياً من مواقع الأقسام";
  }
}

/* ---------- شاشة الدخول ---------- */
let gatePick=null;
/* بصمة حالة شاشة الدخول: تتغير فقط إذا تغيّر ما يُعرض فعلاً */
function gateSig(){
  const e=Access.entries();
  return [Store.ready?1:0, Access.configured()?1:0, PW_TARGETS.map(t=>e[t.k]?1:0).join(""), gatePick||""].join("|");
}
/* يعيد رسم شاشة الدخول مع الإبقاء على ما كتبه المستخدم */
function renderGate(){
  const old=$("#gate");
  const samePick = !!old && !old.hidden && old.dataset.pick===String(gatePick||"");
  const keep={};
  if(samePick) $$("input[id]",old).forEach(i=>{ keep[i.id] = i.type==="checkbox" ? i.checked : i.value; });
  const act = (old && document.activeElement && old.contains(document.activeElement)) ? document.activeElement.id : "";
  renderGateInner();
  const g=$("#gate");
  if(samePick){
    Object.keys(keep).forEach(id=>{
      const i=document.getElementById(id);
      if(!i || !g.contains(i)) return;
      if(i.type==="checkbox") i.checked=keep[id]; else i.value=keep[id];
    });
    if(act){ const a=document.getElementById(act); if(a) setTimeout(()=>a.focus(),80); }
  }
  g.dataset.sig=gateSig();
  g.dataset.pick=String(gatePick||"");
}
function renderGateInner(){
  $(".app").hidden=true;
  let g=$("#gate");
  if(!g){ g=document.createElement("div"); g.id="gate"; g.className="gate"; document.body.appendChild(g); }
  g.hidden=false;

  const head='<div class="gate-top"><div class="seal">أ ع</div><div>'+
    '<div class="gate-t">سجل صيانة الأجهزة</div>'+
    '<div class="gate-s">وزارة الأشغال العامة · إدارة نظم المعلومات</div></div></div>';

  if(!Store.ready){
    g.innerHTML='<div class="gate-card">'+head+'<div class="gate-b"><p style="margin:0;color:var(--ink-2)">جارٍ الاتصال بقاعدة البيانات…</p></div></div>';
    return;
  }
  if(Store.error){
    g.innerHTML='<div class="gate-card">'+head+'<div class="gate-b"><div class="gate-err on">'+esc(Store.error)+'</div>'+
      '<button class="btn pri" style="justify-content:center" onclick="location.reload()">إعادة المحاولة</button></div></div>';
    return;
  }

  /* أول تشغيل: ضبط كلمات السر */
  if(!Access.configured()){
    g.innerHTML='<div class="gate-card">'+head+
      '<div class="gate-b">'+
        '<p class="note" style="margin:0">لم تُضبط كلمات السر بعد. اضبطها الآن مرة واحدة — بعدها لن يدخل أي موظف إلا بكلمة سر موقعه.</p>'+
        pwField("sp1","كلمة سر "+SITES[0],{auto:"new-password", ph:"٤ أحرف على الأقل"})+
        pwField("sp2","كلمة سر "+SITES[1],{auto:"new-password", ph:"٤ أحرف على الأقل"})+
        '<div class="pick-sub-field">'+
          pwField("sp3","كلمة سر مشرف الفريق — "+SITES[1]+" (اختيارية)",{auto:"new-password", ph:"يدير موظفي المركز الحكومي وقطع غياره",
            hint:"مشرف الفريق تابع للمركز الحكومي ويرى بياناته وحده."})+
        '</div>'+
        pwField("sp4","كلمة سر رئيس القسم (اختيارية)",{auto:"new-password", ph:"يرى الموقعين وله لوحة خاصة للاعتماد",
          hint:"لوحة رئيس القسم خاصة به وحده ولا تظهر لأي جهة أخرى."})+
        '<div class="gate-err" id="gErr"></div>'+
        '<button class="btn pri" id="gSet" style="justify-content:center">حفظ وتفعيل الحماية</button>'+
      '</div>'+
      '<div class="gate-foot">تُحفظ كلمات السر مُجزَّأة (hash) في قاعدة البيانات، ولا تُخزَّن كنص صريح.</div></div>';
    const err=m=>{ const e=$("#gErr"); e.textContent=m; e.classList.add("on"); };
    $("#gSet").onclick=async()=>{
      const a=$("#sp1").value, b=$("#sp2").value, c=$("#sp3").value, d=$("#sp4").value;
      if(a.length<4||b.length<4){ err("كلمتا سر الموقعين مطلوبتان، و٤ أحرف على الأقل لكل منهما."); return; }
      if(a===b){ err("يجب أن تختلف كلمة سر المبنى الرئيسي عن كلمة سر المركز الحكومي."); return; }
      if(c && c.length<4){ err("كلمة سر المشرف يجب ألا تقل عن ٤ أحرف."); return; }
      if(d && d.length<4){ err("كلمة سر رئيس القسم يجب ألا تقل عن ٤ أحرف."); return; }
      if(d && (d===a||d===b||d===c)){ err("يجب أن تختلف كلمة سر رئيس القسم عن باقي كلمات السر."); return; }
      $("#gSet").disabled=true;
      const pairs=[[SITES[0],a],[SITES[1],b]];
      if(d) pairs.push([CHIEF_KEY,d]);
      if(c) pairs.push([ADMIN_KEY,c]);
      await Access.setMany(pairs);
      toast("تم تفعيل الحماية");
      renderGate();
    };
    return;
  }

  /* شاشة الدخول */
  const isSet = k => Access.auth() || !!Access.entries()[k];
  const opts=[
    {k:SITES[0],  nm:SITES[0],       ds:"سجلات ومخزن وتقارير المبنى الرئيسي فقط"},
    {k:SITES[1],  nm:SITES[1],       ds:"سجلات ومخزن وتقارير المركز الحكومي فقط"},
    {k:CHIEF_KEY, nm:"رئيس القسم",   ds:"لوحة خاصة للمتابعة واعتماد الأوامر في الموقعين"},
    {k:ADMIN_KEY, nm:"مشرف الفريق",  ds:"مشرف المركز الحكومي — موظفوه وقطع غياره وكلمات سره", parent:SITES[1]}
  ];
  if(!gatePick || !opts.some(o=>o.k===gatePick)) gatePick=opts[0].k;
  const picked=opts.find(o=>o.k===gatePick);
  const first=!isSet(gatePick);

  g.innerHTML='<div class="gate-card">'+head+
    '<div class="gate-b">'+
      '<div class="field"><label>اختر جهة الدخول</label><div class="gate-pick">'+
        (()=>{
          const btn=(o,sub)=>'<button type="button" class="pick'+(sub?" sub":"")+'" data-k="'+esc(o.k)+'" aria-pressed="'+(o.k===gatePick)+'">'+
            '<span class="mark"></span><span><span class="nm">'+esc(o.nm)+'</span>'+
            '<span class="ds" style="display:block">'+esc(o.ds)+'</span></span></button>';
          return opts.filter(o=>!o.parent).map(o=>{
            const kids=opts.filter(c=>c.parent===o.k);
            if(!kids.length) return btn(o);
            const on = o.k===gatePick || kids.some(c=>c.k===gatePick);
            return '<div class="pick-group'+(on?" on":"")+'">'+btn(o)+
              '<div class="pick-kids">'+kids.map(c=>btn(c,true)).join("")+'</div></div>';
          }).join("");
        })()+
      '</div></div>'+
      pwField("gPass","كلمة السر",{auto:first?"new-password":"current-password",
        ph: first ? "اختر كلمة سر «"+picked.nm+"» — ٤ أحرف على الأقل" : "كلمة سر الجهة المختارة"})+
      '<p class="hint" id="gLang" style="margin:-4px 0 0;min-height:1.3em" aria-live="polite"></p>'+
      (first ? pwField("gPass2","تأكيد كلمة السر",{auto:"new-password"})+
               '<p class="hint" style="margin:-4px 0 0">أول دخول لجهة «'+esc(picked.nm)+'» — اختر كلمة سرها الآن، وتُطلب منها في كل دخول لاحق.</p>' : "")+
      '<label class="check"><input type="checkbox" id="gRem"> ابقني مسجَّلاً على هذا الجهاز</label>'+
      '<div class="gate-err" id="gErr"></div>'+
      '<button class="btn pri" id="gIn" style="justify-content:center">'+(first?"ضبط كلمة السر والدخول":"دخول")+'</button>'+
    '</div>'+
    '<div class="gate-foot">'+(Access.auth()
      ? 'الدخول بحسابات Firebase — كل جهة ترى قاعدة موقعها فقط، والحماية مطبّقة على الخادم.'
      : 'كل جهة ترى بياناتها فقط، وتغيّر كلمة سرها من صفحة الإعدادات. مشرف الفريق يعيد ضبط كلمة سر المركز الحكومي.')+'</div></div>';

  $$(".pick",g).forEach(b=>b.onclick=()=>{ gatePick=b.dataset.k; renderGate(); });

  const submit=async()=>{
    let layoutNote=false;
    const e=$("#gErr");
    e.classList.remove("on");
    const err=m=>{ e.textContent=m; e.classList.add("on"); };
    const pass=$("#gPass").value;
    if(!pass){ err(first?"اختر كلمة السر.":"أدخل كلمة السر."); return; }
    $("#gIn").disabled=true;

    if(first){
      const p2=$("#gPass2").value;
      if(pass.length<4){ err("كلمة السر يجب ألا تقل عن ٤ أحرف."); $("#gIn").disabled=false; return; }
      if(pass!==p2){ err("كلمتا السر غير متطابقتين."); $("#gIn").disabled=false; return; }
      for(const t of PW_TARGETS){
        if(t.k!==gatePick && await Access.check(t.k,pass)){
          err("هذه الكلمة مستخدمة لـ«"+t.nm+"» — اختر كلمة مختلفة."); $("#gIn").disabled=false; return;
        }
      }
      await Access.setMany([[gatePick,pass]]);
    }else if(Access.auth()){
      const res=await Store.authSignIn(gatePick, pass, $("#gRem").checked);
      layoutNote=res.variant;
      if(!res.ok){ err(res.msg); $("#gIn").disabled=false; $("#gPass").select(); return; }
    }else{
      const res=await Access.checkAny(gatePick,pass);
      layoutNote=res.variant;
      if(!res.ok){
        err("كلمة السر غير صحيحة لهذه الجهة. تأكد من الجهة المختارة، ومن زر Caps Lock.");
        $("#gIn").disabled=false; $("#gPass").select(); return;
      }
    }

    Access.signIn(gatePick, $("#gRem").checked);
    $("#gate").hidden=true; $(".app").hidden=false;
    render();
    toast(first ? "تم ضبط كلمة السر — مرحباً "+Access.label()
                : (layoutNote ? "تم الدخول — كُتبت كلمة السر بلغة لوحة مفاتيح مختلفة عن التي ضُبطت بها" : "مرحباً — "+Access.label()));
  };
  $("#gIn").onclick=submit;
  $("#gPass").onkeydown=ev=>{ if(ev.key==="Enter") submit(); };
  {
    const gp=$("#gPass"), gl=$("#gLang");
    const langHint=ev=>{
      if(!gl) return;
      const m=gp.value.match(/([ء-ي]|[A-Za-z])[^ء-يA-Za-z]*$/);
      const last=m?m[1]:"";
      const out=[];
      if(/[ء-ي]/.test(last)) out.push("لغة الكتابة الآن: عربي");
      else if(/[A-Za-z]/.test(last)) out.push("لغة الكتابة الآن: English");
      if(ev && ev.getModifierState && ev.getModifierState("CapsLock")) out.push("زر Caps Lock مفعّل");
      gl.textContent=out.join(" · ");
    };
    gp.addEventListener("input",langHint);
    gp.addEventListener("keyup",langHint);
  }
  const g2=$("#gPass2"); if(g2) g2.onkeydown=ev=>{ if(ev.key==="Enter") submit(); };
  setTimeout(()=>{ const p=$("#gPass"); if(p) p.focus(); },60);
}

function onStoreChange(){
  if(!Access.in()){
    Access.restore();

      /* لا تُعِد رسم شاشة الدخول مع كل تحديث من قاعدة البيانات — كان ذلك يمسح كلمة السر أثناء كتابتها */
      const g=$("#gate");
      if(!g || g.hidden || g.dataset.sig!==gateSig()) renderGate();
      return;
    }
  }
  Store.openSites(allowedSites());

}

  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : (cur==="light" ? "dark" : (matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"));
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("mpw.theme",next); }catch(e){}
  render();
};
render();
Store.on(onStoreChange);
Store.init().then(()=>{ onStoreChange(); });
})();
</script>
